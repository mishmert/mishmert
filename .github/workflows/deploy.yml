name: Deploy source to GitHub Pages

# Minimal no-build workflow: uploads the repo root as-is to GitHub Pages.
# Restores the pre-Vite behaviour (19 classic <script src="..."> tags served
# directly from the repo) that worked on mobile, without requiring you to
# flip the Pages source setting back to "Deploy from a branch".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload source as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
