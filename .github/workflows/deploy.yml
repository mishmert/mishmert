name: Test and deploy to GitHub Pages

# Single-job workflow: tests and deploy share one runner so there is no
# cross-job artifact handoff (the two-job variant hit a race between
# upload-pages-artifact@v3 and deploy-pages@v4 where the deploy could not
# find the artifact the previous step had just uploaded).
#
# Order: checkout → install → playwright → tests → upload → deploy.
# If the test step fails, every later step is skipped and GitHub Pages
# keeps serving the previous good deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run smoke tests
        run: npm test
        env:
          CI: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Pages artifact must NOT include node_modules / playwright caches / the
      # tests folder itself — those bloat the artifact and are not needed at
      # runtime. Copy only the files the live site actually serves.
      - name: Stage artifact contents
        run: |
          mkdir -p _site
          cp -r index.html privacy.html styles.css sw.js manifest.json js/ \
                CNAME *.png _site/
          echo "Artifact contents:" && ls -la _site/

      # Pack and upload the artifact manually with the exact name + content
      # type deploy-pages@v4 expects. Doing this inline (instead of using
      # upload-pages-artifact@v3) avoids a race the v3 action keeps losing
      # against deploy-pages on this project ("No artifacts named
      # 'github-pages' were found for this workflow run" even though the
      # upload step reported success).
      - name: Pack _site into a Pages tar
        run: |
          tar \
            --dereference --hard-dereference \
            --directory _site \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
