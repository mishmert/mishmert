name: Test and deploy to GitHub Pages

# Single-job workflow: tests and deploy share one runner. The deploy step
# only runs if every browser project in the Playwright suite passes.
#
# Flow: checkout → install → playwright → vite build → tests on dist/ →
# upload dist/ → deploy. If anything fails, Pages keeps serving the
# previous good deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build with Vite
        run: npm run build

      # Run the Playwright suite against the BUILT dist/, not the source.
      # The playwright.config.js webServer serves dist/ when VITE_SERVE_DIST=1
      # is set below.
      - name: Run smoke tests against dist/
        run: npm test
        env:
          CI: '1'
          VITE_SERVE_DIST: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # deploy-pages keeps racing upload-pages-artifact — sleep briefly so the
      # artifact finishes indexing before the deploy query runs.
      - name: Wait for artifact to propagate
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          error_count: 20
          reporting_interval: 3000
          timeout: 300000
