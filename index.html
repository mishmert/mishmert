<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- MSH-202646-002 defense-in-depth: Cloudflare already serves a full
         Content-Security-Policy response header. The directives below are
         the ones that only work via meta tag (per spec, frame-ancestors /
         report-uri / sandbox from meta are ignored) AND that don't
         restrict anything the CF header already allows, so there's no
         risk of intersection breaking the site. They matter when the
         app is loaded outside the CF edge (local preview, service-worker
         offline) where no response header is present.
         NB: `upgrade-insecure-requests` was intentionally omitted — it
         broke WebKit smoke tests on http://localhost:4173 (WebKit upgraded
         the test URL to https and died on TLS handshake). CF already
         serves it at the edge in production, where it works correctly. -->
    <meta http-equiv="Content-Security-Policy" content="base-uri 'self'; form-action 'self'; object-src 'none';" />
    <title>משמרת — ניהול משמרות חכם</title>
    <link rel="icon" type="image/png" href="logo-favicon.png" />
    <link rel="shortcut icon" type="image/png" href="logo-favicon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <!-- Twemoji: parses emoji chars and swaps them with SVG images (Twitter emoji set). Guarantees
     identical, colorful emoji everywhere regardless of OS (Windows without Segoe UI Emoji,
     older Androids, Linux, ChromeOS, etc). Loaded async so it never blocks page render. -->
    <!-- MSH-202648-005: version is pinned and integrity-locked. If a CDN
     compromise swaps the file, the browser refuses to execute it. -->
    <script
      src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js"
      integrity="sha384-32KMvAMS4DUBcQtHG6fzADguo/tpN1Nh6BAJa2QqZc6/i0K+YPQE+bWiqBRAWuFs"
      crossorigin="anonymous"
      async
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
      integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
      crossorigin="anonymous"
    ></script>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="משמרת" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="description" content="משמרת — ניהול משמרות חכם לצוותים. פשוט. שקוף. בעברית." />
    <!-- Open Graph / Facebook / WhatsApp / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mishmert.com/" />
    <meta property="og:title" content="משמרת — ניהול משמרות חכם" />
    <meta property="og:description" content="פשוט. שקוף. בעברית." />
    <meta property="og:image" content="https://mishmert.com/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="משמרת" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="משמרת — ניהול משמרות חכם" />
    <meta name="twitter:description" content="פשוט. שקוף. בעברית." />
    <meta name="twitter:image" content="https://mishmert.com/og-preview.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
