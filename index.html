// By Saturday (Jerusalem time), "next week" is basically tomorrow, so the
// block-submission presets bump forward by one: "next week" becomes what used
// to be "in two weeks", etc.
function _blockPresetBase() {
  return israelNow().getDay() === 6 ? 2 : 1;
}
function fmtDate(d) { return new Date(d+"T00:00:00").toLocaleDateString("he-IL"); }
// (getEmp defined later as a cached version)
function empIdx(id) { return S.employees.findIndex(e=>e.id===id); }
// Employees who should actually appear in the schedule / shift lists.
// Managers flagged schedule_excluded only do management work and are hidden from scheduling.
function schedulableEmployees() { return S.employees.filter(e => !e.schedule_excluded); }

// Per-business feature toggles, controlled by the platform super admin.
function isFeatureEnabled(key) {
  return S.business?.enabled_features?.[key] !== false;
}
const SA_NAV_FEATURE_MAP = { qualifications: "qualifications", swaps: "swaps", swaps_nav: "swaps" };
function filterNavByFeatures(tabsArr) {
  return tabsArr.filter(t => {
    const key = SA_NAV_FEATURE_MAP[t.id];
    return !key || isFeatureEnabled(key);
  });
}

// Returns which admins/managers should receive absence/swap/join notifications.
// The business owner can narrow this down in Settings; otherwise it's everyone with the role.
function getNotifiedManagers() {
  const allMgrs = S.employees.filter(e => (e.role === "admin" || e.role === "manager") && e.email);
  const configured = S.business?.notified_manager_ids;
  if (Array.isArray(configured) && configured.length > 0) {
    return allMgrs.filter(m => configured.includes(m.id));
  }
  return allMgrs;
}

// Time-based greeting in Hebrew — use Israel wall-clock so someone opening the
// app from abroad still gets the greeting that matches their team's day.
function getTimeBasedGreeting() {
  const hour = israelNow().getHours();
  if (hour >= 5 && hour < 12) return { text: "בוקר טוב", emoji: "☀️" };       // 05:00 - 11:59
  if (hour >= 12 && hour < 17) return { text: "צהריים טובים", emoji: "🌤️" };  // 12:00 - 16:59
  if (hour >= 17 && hour < 21) return { text: "ערב טוב", emoji: "🌆" };       // 17:00 - 20:59
  return { text: "לילה טוב", emoji: "🌙" };                                    // 21:00 - 04:59
}

// Generate cryptographically secure token (64 hex chars = 256 bits entropy)
function generateSecureToken() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return Array.from(arr, b => b.toString(16).padStart(2, "0")).join("");
}

// Validate email format
function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// Reads ?goto=<target> from the URL and navigates to the matching screen.
// Works for both managers and employees (routing differs by role).
function applyDeepLink() {
  let goto = null;
  try {
    const params = new URLSearchParams(window.location.search);
    goto = params.get("goto");
  } catch (e) { return; }
  if (!goto) return;

  const isMgr = (typeof isManager === "function") ? isManager() : (S.profile?.role !== "employee");

  // Map the goto target to the right view/tab for this role
  switch (goto) {
    case "schedule":
      if (isMgr) { S.view = "schedule"; }
      else { S.view = "empview"; S.empViewTab = "schedule"; }
      break;
    case "vacations":
      if (isMgr) { S.view = "vacations"; }
      else { S.view = "empview"; S.empViewTab = "vacation"; }
      break;
    case "swaps":
      if (isMgr) { S.view = "swaps"; }
      else { S.view = "empview"; S.empViewTab = "swaps_emp"; }
      break;
    case "blocks":
      if (isMgr) { S.view = "blocks"; }
      else { S.view = "empview"; S.empViewTab = "avail"; }
      break;
    case "join":
    case "home":
      S.view = isMgr ? "home" : "empview";
      break;
    case "shifts":
      S.view = "empview"; S.empViewTab = "shifts";
      break;
    default:
      break;
  }

  // Clean the URL so a refresh doesn't re-trigger the deep link
  try {
    const clean = window.location.origin + window.location.pathname;
    window.history.replaceState({}, "", clean);
  } catch (e) {}
}

async function checkAuth() {
  // Check for invitation token in URL
  const params = new URLSearchParams(window.location.search);
  const inviteToken = params.get("invite");
  const bizInviteToken = params.get("biz_invite");

  if (bizInviteToken) {
    const { data, error } = await sb.rpc("validate_business_invite_token", { p_token: bizInviteToken });
    if (error || !data || data.length === 0) {
      await uiAlert({title:"לינק לא תקין", message:"הלינק שהשתמשת בו לא נמצא במערכת.", tone:"danger"});
      window.history.replaceState({}, "", window.location.pathname);
    } else {
      const inv = data[0];
      if (!inv.is_valid) {
        const reasons = {
          invalid_token: "הלינק לא תקין",
          already_used: "ההזמנה כבר נוצלה",
          revoked: "ההזמנה בוטלה",
          expired: "ההזמנה פגה"
        };
        await uiAlert({title:"הזמנה לא תקפה", message:reasons[inv.error_reason] || "ההזמנה לא זמינה יותר.", tone:"danger"});
        window.history.replaceState({}, "", window.location.pathname);
      } else {
        S.pendingBizInvite = { token: bizInviteToken, email: inv.email, note: inv.note };
        S.loginMode = "register";
        S.view = "login";
        render();
        return;
      }
    }
  }

  if (inviteToken) {
    // Validate the token
    const { data, error } = await sb.rpc("validate_invitation_token", { p_token: inviteToken });
    if (error || !data || data.length === 0) {
      await uiAlert({title:"לינק לא תקין", message:"הלינק שהשתמשת בו לא נמצא במערכת.", tone:"danger"});
      window.history.replaceState({}, "", window.location.pathname);
    } else {
      const inv = data[0];
      if (!inv.is_valid) {
        const reasons = {
          invalid_token: "הלינק לא תקין",
          already_used: "ההזמנה כבר נוצלה",
          revoked: "ההזמנה בוטלה",
          expired: "ההזמנה פגה"
        };
        await uiAlert({title:"הזמנה לא תקפה", message:reasons[inv.error_reason] || "ההזמנה לא זמינה יותר.", tone:"danger"});
        window.history.replaceState({}, "", window.location.pathname);
      } else {
        // Valid - show special invitation signup
        S.pendingInvitation = {
          token: inviteToken,
          email: inv.email,
          name: inv.name,
          role: inv.role,
          businessName: inv.business_name
        };
        S.loginMode = "accept_invitation";
        S.view = "login";
        render();
        return;
      }
    }
  }
  
  // Password-reset flow — when the user clicks the link from the "forgot password"
  // email, Supabase creates a recovery session and redirects here with ?reset=true.
  // Previously we just dumped them into loadAll → MFA challenge → login WITHOUT letting
  // them pick a new password. Now we route to a dedicated password-reset view instead.
  const isResetFlow = params.get("reset") === "true" || /[?&#]type=recovery/.test(window.location.href);
  if (isResetFlow) {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      S.view = "password_reset";
      S.resetUserEmail = session.user.email || "";
      // Keep the URL clean so a refresh doesn't re-trigger the flow after they save.
      window.history.replaceState({}, "", window.location.pathname);
      render();
      return;
    }
  }

  const { data: { session } } = await sb.auth.getSession();
  if (!session?.user) { S.view="login"; render(); return; }
  await loadAll(session.user);
}

// ═══ PASSWORD RESET VIEW — shown after clicking the email reset link ═══
// User must choose a new password before we take them into the app (and before the
// MFA challenge fires). The recovery session is already AAL1; after the update, we

function viewPasswordReset() {
  const wrap = div("app");
  const box = e("div",{style:"max-width:440px;margin:0 auto;padding:40px 24px"});

  box.appendChild(e("div",{style:"text-align:center;margin-bottom:28px"},[

  ]));

  const card = div("card");
  const p1 = e("input",{class:"fi",type:"password",placeholder:"סיסמה חדשה (לפחות 10 תווים)",autocomplete:"new-password",style:"margin-bottom:12px"});
  const p2 = e("input",{class:"fi",type:"password",placeholder:"אישור סיסמה חדשה",autocomplete:"new-password",style:"margin-bottom:12px"});
  card.appendChild(p1);
  card.appendChild(p2);
  card.appendChild(e("div",{style:"font-size:11px;color:#64748B;margin-bottom:12px;line-height:1.5"},
    "💡 לפחות 10 תווים"));
  card.appendChild(btn("btn-primary","✓ שמור סיסמה חדשה", async () => {
    const newPass = p1.value;
    const confPass = p2.value;
    const pwErr = validatePassword(newPass);
    if (pwErr) { toast(pwErr, "err"); return; }
    if (newPass !== confPass) { toast("הסיסמאות לא תואמות", "err"); return; }
    try {
      const { error } = await sb.auth.updateUser({ password: newPass });
      if (error) { toast(friendlyError(error), "err"); return; }
      toast("סיסמה עודכנה ✓");
      // Now hand off to the normal MFA gate — the user will be asked for their
      // Authenticator code (if they have one) or to enroll (if not).
      const { data: { user } } = await sb.auth.getUser();
      if (user) await loadAll(user);
      else { S.view = "login"; render(); }
    } catch (err) {
      toast(friendlyError(err), "err");
    }
  },{style:"width:100%"}));

  box.appendChild(card);

  box.appendChild(e("div",{style:"text-align:center;margin-top:20px"},[
    e("a",{href:"#", style:"color:#64748B;font-size:13px;text-decoration:underline", onclick: async (ev) => {
      ev.preventDefault();
      await sb.auth.signOut();
      location.reload();
    }}, "ביטול והתנתקות")
  ]));

  wrap.appendChild(box);
  return wrap;
}

// Returns the active acting employee ID:

function getActiveProfile() {
  if (S.testAsEmployee && S.empViewId) {
    return S.employees.find(e => e.id === S.empViewId) || S.profile;

  return S.profile;
}

function isManager() {
  if (S.testAsEmployee) return false;
  return S.profile?.role === "admin" || S.profile?.role === "manager";
}

  return S.profile?.role === "admin";

    (async () => {
      try {
        // Clean up any orphan unverified factors from previous attempts
        const { data: existing } = await sb.auth.mfa.listFactors();
        for (const f of (existing?.all || [])) {
          if (f.status !== "verified") {
            await sb.auth.mfa.unenroll({ factorId: f.id });
          }
        }
        const { data, error } = await sb.auth.mfa.enroll({
          factorType: "totp",
          friendlyName: "משמרת — " + (S.user?.email || "device"),
        });
        if (error) throw error;
        S.mfaEnrollData = {
          factorId: data.id,
          qrCode: data.totp.qr_code,  // data:image/svg+xml;base64,...
          secret: data.totp.secret,
          uri: data.totp.uri,
        };
        render();

        S.mfaEnrollData = { error: err.message };
        render();
      }

    card.appendChild(e("div",{style:"background:#0F172A;border:1px solid #334155;border-radius:10px;padding:10px 14px;font-family:monospace;font-size:13px;color:#E2E8F0;word-break:break-all;margin-bottom:20px;direction:ltr;text-align:center;user-select:all"}, S.mfaEnrollData.secret));

function loginField(lbl, name, type, ph, req=false) {
  // Map to standard autocomplete tokens so iOS Keychain / 1Password / Chrome offer the
  // right suggestion in the right field. Without these hints browsers guess and often miss.
  let ac = null;
  if (type === "email") ac = "email";
  else if (type === "password") ac = name === "pass" ? "current-password" : "new-password";
  else if (name === "name") ac = "name";
  // iOS auto-capitalizes the first letter of a field by default, which breaks email entry
  // ("Raz@..." instead of "raz@..." → confuses the server) and password entry.
  const autocap = (type === "email" || type === "password") ? "off" : null;
  const spellcheck = (type === "email" || type === "password") ? "false" : null;
  return div("field",[
    e("label",{},lbl+(req?" *":"")),
    e("input",{name,type,placeholder:ph,required:req?"required":null,autocomplete:ac,inputmode:type==="email"?"email":null,autocapitalize:autocap,spellcheck})
  ]);
}

  // KPIs
  const kpis = [
    {icon:"👥",lbl:"עובדים",val:S.employees.length,color:"#3B82F6"},
    {icon:"📅",lbl:"שיבוצים השבוע",val:totalAssigned,color:"#10B981"},

    {icon:"🔄",lbl:"חילופים ממתינים",val:pendingSwapsManager,color:"#A855F7"},
  ];
  const kpiGrid = div("kpi-grid");
  kpis.forEach(k => {
    // Convert hex to rgba for the glow — creates a subtle color halo matching each KPI's tone
    const hex = k.color.replace("#","");
    const r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
    kpiGrid.appendChild(div("kpi",[
      div("kpi-icon",[k.icon]),
      e("div",{class:"kpi-val",style:"background:linear-gradient(180deg,"+k.color+","+k.color+"cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text"},String(k.val)),
      div("kpi-lbl",[k.lbl])
    ],{style:"--kpi-glow:rgba("+r+","+g+","+b+",0.22);--kpi-accent:rgba("+r+","+g+","+b+",0.7);border-color:rgba("+r+","+g+","+b+",0.2)"}));
  });
  wrap.appendChild(kpiGrid);

  // Preload the ACTUAL current week into S.schedule so "מי במשמרת עכשיו" works even
  // when the manager has navigated to a different week (e.g. preparing next week's
  // schedule). Runs once per minute and merges — never overwrites — other weeks.
  if (!S._nowCardPreloaded || Date.now() - S._nowCardPreloaded > 60000) {
    S._nowCardPreloaded = Date.now();
    (async () => {
      try {
        // Israel time: the real current week is Sunday–Saturday in Jerusalem,
        // not in the device's zone.
        const nowDate = israelNow();
        const dow = nowDate.getDay();
        const sunday = new Date(nowDate);
        sunday.setDate(sunday.getDate() - dow);
        const sundayStr = sunday.getFullYear()+"-"+String(sunday.getMonth()+1).padStart(2,"0")+"-"+String(sunday.getDate()).padStart(2,"0");
        const { data: sched } = await sb.from("schedules")
          .select("id").eq("business_id", S.profile.business_id)
          .eq("week_start", sundayStr).maybeSingle();
        if (!sched) return;
        const { data: assigns } = await sb.from("assignments")
          .select("date,shift,employee_id,custom_start,custom_end")
          .eq("schedule_id", sched.id);
        let changed = false;
        (assigns||[]).forEach(a => {
          if (!S.schedule[a.date]) S.schedule[a.date] = {};
          if (!S.schedule[a.date][a.shift]) S.schedule[a.date][a.shift] = [];
          if (!S.schedule[a.date][a.shift].includes(a.employee_id)) {
            S.schedule[a.date][a.shift].push(a.employee_id);
            changed = true;
          }
          if (a.custom_start && a.custom_end) {
            S.customHours[a.date+"|"+a.shift+"|"+a.employee_id] = { start: a.custom_start.slice(0,5), end: a.custom_end.slice(0,5) };
          }
        });
        if (changed) render();
      } catch(err) { console.warn("Now-card preload failed:", err); }
    })();
  }

  // ── מי במשמרת עכשיו ──
  // Shows who's actively working right now, plus the next shift starting soon.
  // Reads from S.schedule for today + yesterday (so a night shift that started
  // yesterday 22:45 and ends today 07:00 is correctly shown as "currently working").
  {
    // Israel time: "now" and "today" are the team's local wall-clock, not the device's.
    const nowDate = israelNow();
    const todayStr = nowDate.getFullYear()+"-"+String(nowDate.getMonth()+1).padStart(2,"0")+"-"+String(nowDate.getDate()).padStart(2,"0");
    const yesterdayDt = new Date(nowDate);
    yesterdayDt.setDate(yesterdayDt.getDate() - 1);
    const yesterdayStr = yesterdayDt.getFullYear()+"-"+String(yesterdayDt.getMonth()+1).padStart(2,"0")+"-"+String(yesterdayDt.getDate()).padStart(2,"0");
    const nowMs = nowDate.getTime();
    const nowHM = nowDate.getHours()*60 + nowDate.getMinutes();

    // Convert a "HH:MM" string on a given date to a Date object. For a shift that
    // crosses midnight (end <= start), the end is the next day.
    const shiftWindow = (dateStr, sh) => {
      const d = new Date(dateStr+"T00:00:00");
      const [sh1, sm1] = (sh.start||"00:00").split(":").map(Number);
      const [eh1, em1] = (sh.end||"00:00").split(":").map(Number);
      const startMs = d.getTime() + sh1*3600000 + sm1*60000;
      const startMin = sh1*60 + sm1;
      const endMin = eh1*60 + em1;
      let endMs = d.getTime() + eh1*3600000 + em1*60000;
      if (endMin <= startMin) endMs += 86400000;
      return { startMs, endMs };
    };

    const currentShifts = [];   // {date, sh, empIds, endMs}
    const upcomingShifts = [];  // {date, sh, empIds, startMs, minsUntil}
    const scanDays = [yesterdayStr, todayStr];
    scanDays.forEach(dateStr => {
      const dayShifts = getShiftsForDate(dateStr);
      dayShifts.forEach(sh => {
        const empIds = (S.schedule[dateStr]?.[sh.id]||[]);
        if (empIds.length === 0) return;
        const win = shiftWindow(dateStr, sh);
        if (nowMs >= win.startMs && nowMs < win.endMs) {
          currentShifts.push({ dateStr, sh, empIds, endMs: win.endMs });
        } else if (win.startMs > nowMs && (win.startMs - nowMs) < 12*3600000) {
          upcomingShifts.push({ dateStr, sh, empIds, startMs: win.startMs });
        }
      });
    });
    // Earliest upcoming only
    upcomingShifts.sort((a,b) => a.startMs - b.startMs);
    const nextShift = upcomingShifts[0];

    const nowCard = div("card",[
      e("div",{style:"display:flex;align-items:center;gap:10px;margin-bottom:14px"},[
        e("span",{style:"font-size:20px"},"🟢"),
        e("div",{style:"flex:1"},[
          e("div",{style:"font-weight:800;font-size:15px;color:#E2E8F0"},"מי במשמרת עכשיו"),
          e("div",{style:"font-size:11px;color:#64748B;margin-top:2px"},nowDate.toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})+" · "+nowDate.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"}))
        ])
      ])
    ]);

    if (currentShifts.length === 0) {
      nowCard.appendChild(e("div",{style:"text-align:center;padding:16px;color:#64748B;font-size:13px"},"אין משמרת פעילה כרגע"));
    } else {
      currentShifts.forEach(cs => {
        const minsLeft = Math.round((cs.endMs - nowMs) / 60000);
        const hoursLeft = Math.floor(minsLeft / 60);
        const remMins = minsLeft % 60;
        const timeLeftStr = hoursLeft > 0 ? `${hoursLeft}ש' ${remMins}דק'` : `${remMins} דק'`;

        const shiftBlock = e("div",{style:`background:#0F172A;border:1px solid ${cs.sh.color}44;border-radius:12px;padding:12px;margin-bottom:8px`},[
          e("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"},[
            e("div",{style:"display:flex;align-items:center;gap:8px"},[
              e("span",{style:"display:inline-block;width:10px;height:10px;border-radius:50%;background:"+cs.sh.color+";box-shadow:0 0 8px "+cs.sh.color}),
              e("span",{style:`font-weight:800;font-size:14px;color:${cs.sh.color}`}, cs.sh.label),
              e("span",{style:"direction:ltr;font-size:11px;color:#94A3B8"}, cs.sh.start+"-"+cs.sh.end)
            ]),
            e("span",{style:"font-size:11px;background:#10B98122;color:#10B981;border:1px solid #10B98144;border-radius:6px;padding:3px 8px;font-weight:700"},"עוד "+timeLeftStr)
          ]),
          e("div",{style:"display:flex;flex-wrap:wrap;gap:6px"},
            cs.empIds.map(id => {
              const emp = getEmp(id);
              if (!emp) return null;
              const col = ec(empIdx(id));
              const chKey = cs.dateStr+"|"+cs.sh.id+"|"+id;
              const ch = S.customHours[chKey];
              return e("div",{style:`background:${col}22;border:1px solid ${col}66;border-radius:10px;padding:5px 11px;display:flex;align-items:center;gap:6px`},[
                e("span",{style:`font-weight:700;font-size:12px;color:${col}`}, emp.name.split(" ")[0]),
                ch ? e("span",{style:"direction:ltr;font-size:10px;color:#94A3B8"}, "("+ch.start+"-"+ch.end+")") : null
              ]);
            }).filter(Boolean)
          )
        ]);
        nowCard.appendChild(shiftBlock);
      });
    }

    // Next shift coming up (within 12h)
    if (nextShift) {
      const minsUntil = Math.round((nextShift.startMs - nowMs) / 60000);
      const hUntil = Math.floor(minsUntil / 60);
      const mUntil = minsUntil % 60;
      const untilStr = hUntil > 0 ? `${hUntil}ש' ${mUntil}דק'` : `${mUntil} דק'`;
      nowCard.appendChild(e("div",{style:`background:${nextShift.sh.color}08;border:1px dashed ${nextShift.sh.color}44;border-radius:10px;padding:10px 12px;margin-top:10px`},[
        e("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"},[
          e("span",{style:"font-size:11px;color:#94A3B8;font-weight:700"},"⏳ הבא: "+nextShift.sh.label+" ("+nextShift.sh.start+")"),
          e("span",{style:"font-size:11px;color:"+nextShift.sh.color+";font-weight:700"},"בעוד "+untilStr)
        ]),
        e("div",{style:"display:flex;flex-wrap:wrap;gap:4px"},
          nextShift.empIds.map(id => {
            const emp = getEmp(id);
            if (!emp) return null;
            return e("span",{style:"font-size:11px;color:#CBD5E1"}, emp.name.split(" ")[0]);
          }).filter(Boolean).reduce((acc,el,i) => {
            if (i > 0) acc.push(e("span",{style:"color:#475569"}, " · "));
            acc.push(el);
            return acc;
          },[])
        )
      ]));
    }

    wrap.appendChild(nowCard);
  }

  // Week snapshot
  const snap = div("card",[
    div("",[ 
      e("div",{style:"font-weight:700;font-size:14px;color:#E2E8F0"},"📅 השבוע הנוכחי"),
      e("div",{style:"font-size:12px;color:#64748B;margin-top:2px"},fmtDate(wd[0])+" — "+fmtDate(wd[6]))
    ].map(x=>x),{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"}),
    isPublished ? div("",[
      div("published-banner",["📢 פורסם לעובדים"]),
      btn("btn-sm btn-sm-gray","🔁 יש עדכון? פרסם שוב",()=>{S.showPublishModal=true;render();},{style:"width:100%;margin-top:8px"})
    ]) :
    totalAssigned > 0 ? btn("btn-purple","📢 פרסם סידור לעובדים",()=>{S.showPublishModal=true;render();},{style:"width:100%"}) :
    e("div",{style:"color:#64748B;font-size:13px;text-align:center"},"אין שיבוצים השבוע")
  ]);
  wrap.appendChild(snap);

  // Alerts
  const alerts = [];
  if (pendingVacs > 0) alerts.push({class:"alert-warn",icon:"🌴",msg:`${pendingVacs} בקשות חופשה ממתינות לאישור`,view:"vacations"});
  if (pendingSwapsManager > 0) alerts.push({class:"alert-warn",icon:"🔄",msg:`${pendingSwapsManager} בקשות חילוף ממתינות לאישורך`,view:"swaps"});
  if (alerts.length > 0) {
    const alertCard = div("card",[e("div",{style:"font-weight:700;font-size:14px;color:#E2E8F0;margin-bottom:10px"},"🔔 דורש טיפול")]);
    alerts.forEach(a => alertCard.appendChild(
      e("div",{class:"alert "+a.class,style:"cursor:pointer",onclick:()=>{S.view=a.view;render();}},[
        e("span",{style:"flex-shrink:0"},a.icon),
        e("span",{style:"flex:1"},a.msg),
        e("span",{},"←")
      ])
    ));
    wrap.appendChild(alertCard);
  }

  // Quick nav
  const quick = div("quick-grid");
  [{icon:"📅",lbl:"סידור עבודה",sub:"שיבוץ השבוע",v:"schedule"},
   {icon:"👥",lbl:"עובדים",sub:`${S.employees.length} עובדים`,v:"employees"},
   {icon:"🌴",lbl:"חופשות",sub:`${pendingVacs} ממתינות`,v:"vacations"},
  ].forEach(it => quick.appendChild(
    e("button",{class:"quick-btn",onclick:()=>{S.view=it.v;render();}},[
      div("q-icon",[it.icon]),
      div("q-label",[it.lbl]),
      div("q-sub",[it.sub])
    ])
  ));
  wrap.appendChild(quick);
  return wrap;
}

// ── SCHEDULE ──
function viewSchedule() {
  const wd = getWeekDates(S.weekOffset);
  const wdDisplay = wd;
  const weekStart = wd[0];
  const isPublished = S.publishedWeeks.has(weekStart);
  const isInitial = S.publishedInitial?.has(weekStart);
  const hasPublish = isPublished || isInitial || S.schedPublishType?.[weekStart];
  const wrap = e("div");

  // Employee: block unpublished schedules — or expired (visible_until passed)
  if (!isManager() && (!hasPublish || S.scheduleExpired)) {
    wrap.appendChild(div("card",[
      e("div",{style:"text-align:center;padding:40px"},[
        e("div",{style:"font-size:48px;margin-bottom:12px"},S.scheduleExpired ? "⏳" : "🔒"),
        e("div",{style:"font-weight:800;font-size:18px;color:#94A3B8;margin-bottom:8px"},
          S.scheduleExpired ? "הסידור בהכנה" : "הסידור טרם פורסם"),
        e("div",{style:"font-size:13px;color:#64748B"},
          S.scheduleExpired ? "הסידור הסופי יפורסם בקרוב — נעדכן אותך" : "הסידור יהיה זמין לצפייה לאחר פרסום"),
        e("div",{style:"display:flex;gap:8px;justify-content:center;margin-top:20px"},[
          btn("btn-sm btn-sm-gray","→",()=>{S.weekOffset--;loadSchedule().then(()=>render());}),
          btn("btn-sm btn-sm-blue","השבוע",()=>{S.weekOffset=0;loadSchedule().then(()=>render());}),
          btn("btn-sm btn-sm-gray","←",()=>{S.weekOffset++;loadSchedule().then(()=>render());})
        ])
      ])
    ]));
    return wrap;
  }

  // Header
  const hdr = div("section-header",[
    e("div",{},[
      div("page-title",["📅 סידור שבועי"]),
      e("div",{style:"font-size:13px;color:#64748B;margin-top:2px"},fmtDate(wd[0])+" — "+fmtDate(wd[6])),
      isPublished ? div("published-banner",["📢 פורסם"]) : null
    ]),
    e("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},[
      btn("btn-sm btn-sm-gray","→",()=>{S.weekOffset--;S.selectedCell=null;loadSchedule().then(()=>render());}),
      btn("btn-sm btn-sm-blue","השבוע",()=>{S.weekOffset=0;S.selectedCell=null;loadSchedule().then(()=>render());}),
      !isManager() && S.weekOffset >= 0 && !S.publishedInitial?.has(getWeekDates(S.weekOffset+1)[0]) && !S.publishedWeeks.has(getWeekDates(S.weekOffset+1)[0]) ? null : btn("btn-sm btn-sm-gray","←",()=>{S.weekOffset++;S.selectedCell=null;loadSchedule().then(()=>render());}),
      isManager() ? btn("btn-green","⚡ שיבוץ אוטומטי",runSmartSchedule) : null,
      isManager() ? btn(canUndo()?"btn-orange":"btn-sm btn-sm-gray","↶ בטל", canUndo()?undoSchedule:()=>toast("אין מה לבטל","err"), {title:"בטל פעולה אחרונה (Ctrl+Z)", style: canUndo()?"":"opacity:0.4"}) : null,
      isManager() ? btn(canRedo()?"btn-orange":"btn-sm btn-sm-gray","↷ חזור", canRedo()?redoSchedule:()=>toast("אין מה לחזור","err"), {title:"חזור על פעולה (Ctrl+Y)", style: canRedo()?"":"opacity:0.4"}) : null,
      isManager() ? btn("btn-sm btn-sm-red","🗑️ נקה שבוע",async ()=>{
        if(!(await uiConfirm({title:"לנקות את השבוע?", message:"כל השיבוצים בשבוע הנוכחי יימחקו. הפעולה ניתנת לביטול עם ↶.", tone:"warn", okLabel:"נקה שבוע"}))) return;
        const wd2 = getWeekDates(S.weekOffset);
        wd2.forEach(d=>{if(S.schedule[d]) SHIFTS.forEach(sh=>{S.schedule[d][sh.id]=[];});});
        saveScheduleToDB();
        toast("השבוע נוקה ✓");render();
      }) : null,
      isManager() ? (isPublished ? btn("btn-sm btn-sm-gray","🔁 פרסם שוב",()=>{S.showPublishModal=true;render();}) : btn("btn-purple","📢 פרסם",()=>{S.showPublishModal=true;render();})) : null
    ])
  ]);
  wrap.appendChild(hdr);

  // Employee blocks + notes for this week (managers only)
  if (isManager()) {
    const weekSubsForNotes = (S.availSubmissions||[]).filter(s => s.week_start === weekStart && getEmp(s.employee_id) && (((s.slots||[]).length > 0) || (s.note||"").trim()));
    if (weekSubsForNotes.length > 0) {
      const notesBtn = e("button",{
        style:"width:100%;background:#F59E0B18;border:1px solid #F59E0B44;color:#FCD34D;border-radius:12px;padding:12px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center",
        onclick:()=>{S.showWeekNotes=!S.showWeekNotes;render();}
      },[
        e("span",{},"🚫 חסימות והערות עובדים לשבוע זה ("+weekSubsForNotes.length+")"),
        e("span",{style:"font-size:11px"},S.showWeekNotes?"▲ הסתר":"▼ הצג")
      ]);
      wrap.appendChild(notesBtn);
      
      if (S.showWeekNotes) {
        const notesCard = div("card",[],{style:"margin-bottom:12px;border:1px solid #F59E0B33;background:#F59E0B08"});
        weekSubsForNotes.forEach(sub => {
          const emp = getEmp(sub.employee_id);
          const idx = empIdx(sub.employee_id);
          const col = ec(idx);
          const row = e("div",{style:"display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #33415544"},[
            e("div",{style:"width:32px;height:32px;border-radius:8px;background:"+col+"22;border:1px solid "+col+"44;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:"+col+";flex-shrink:0"},
              emp.name.split(" ").map(n=>n[0]).join("").slice(0,2)),
            e("div",{style:"flex:1"})
          ]);
          const infoCol = row.lastChild;
          infoCol.appendChild(e("div",{style:"font-weight:700;font-size:13px;color:#E2E8F0;margin-bottom:4px"},emp.name));
          
          // Show the actual blocked shifts (slots), if any
          // Sort by date first, then by shift chronologically (morning → morning2 → afternoon → night)
          const SHIFT_ORDER = { morning: 0, morning2: 1, afternoon: 2, night: 3 };
          const slots = (sub.slots||[]).slice().sort((a,b)=>{
            const dateCmp = (a.date||"").localeCompare(b.date||"");
            if (dateCmp !== 0) return dateCmp;
            return (SHIFT_ORDER[a.shift] ?? 99) - (SHIFT_ORDER[b.shift] ?? 99);
          });
          if (slots.length > 0) {
            const slotsGrid = e("div",{style:"display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px"});
            slots.forEach(sl => {
              const sh = SHIFT_BY_ID[sl.shift];
              const dt = sl.date ? new Date(sl.date+"T00:00:00") : null;
              const dayLabel = dt ? (DAYS[dt.getDay()]+" "+dt.getDate()+"/"+(dt.getMonth()+1)) : ("יום "+(DAYS[sl.day]||sl.day));
              slotsGrid.appendChild(e("div",{style:"background:#0F172A;border:1px solid "+(sh?.color||"#64748B")+"44;border-radius:6px;padding:3px 8px;font-size:10px"},[
                e("span",{style:"font-weight:700;color:"+(sh?.color||"#94A3B8")},dayLabel+" · "+(sh?.label||sl.shift))
              ]));
            });
            infoCol.appendChild(slotsGrid);
          }
          
          if ((sub.note||"").trim()) {
            infoCol.appendChild(e("div",{style:"font-size:12px;color:#FCD34D;font-style:italic"},"💬 "+sub.note));
          }
          
          notesCard.appendChild(row);
        });
        wrap.appendChild(notesCard);
      }
    }
  }

  // Mobile view toggle (week / day)
  const isDayMode = S.schedMobileView === "day";
  const mobileToggle = e("div",{class:"sched-mobile-toggle"},[
    e("button",{
      class: !isDayMode ? "active" : "",
      onclick: () => { S.schedMobileView = "week"; render(); }
    },"📅 שבוע"),
    e("button",{
      class: isDayMode ? "active" : "",
      onclick: () => { 
        S.schedMobileView = "day"; 
        if (S.schedDayIdx == null) {
          // Default: today if in this week, else first day
          const todayIdx = wd.findIndex(d => d === today());
          S.schedDayIdx = todayIdx >= 0 ? todayIdx : 0;
        }
        render(); 
      }
    },"📆 יום")
  ]);
  wrap.appendChild(mobileToggle);
  
  // Mobile day view (only shown when toggle is on day, hidden on desktop via CSS)
  if (isDayMode) {
    wrap.appendChild(viewScheduleDayMobile(wd));
    return wrap;
  }

  // Grid
  const gridCard = div("card",[],{style:"padding:8px;overflow:hidden;max-width:100%"});
  const gridWrap = div("sched-wrap");
  // Scroll hint on mobile
  gridWrap.appendChild(e("div",{style:"font-size:10px;color:#475569;text-align:center;margin-bottom:4px;display:none",class:"scroll-hint"},"← גלול לצדדים לראות את כל הימים →"));
  const tbl = e("table",{class:"sched-table"});
  const thead = e("thead");
  const hrow = e("tr",[e("th",{style:"width:90px"},"משמרת")]);
  wdDisplay.forEach(date => {
    const dt = new Date(date+"T00:00:00");
    const isToday = date === today();
    hrow.appendChild(e("th",{class:"day-header"+(isToday?" is-today":""),style:isToday?"color:#60A5FA":""},[
      e("div",{style:"font-size:11px"},DAYS[dt.getDay()]),
      e("div",{style:"font-size:18px;font-weight:900;color:"+(isToday?"#60A5FA":"#E2E8F0")},String(dt.getDate())),
      getHoliday(date) ? e("div",{style:"font-size:8px;color:#FCD34D;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px"},"✡️ "+getHoliday(date)) : null
    ]));
  });
  thead.appendChild(hrow);
  tbl.appendChild(thead);

  const tbody = e("tbody");

  // ── שורת העדרויות ──
  if (isManager()) {
    const absRow = e("tr");
    absRow.appendChild(e("td",{style:"border-right:2px solid #F59E0B44;padding-right:12px"},[
      e("div",{style:"font-weight:700;font-size:12px;color:#F59E0B"},"🌴 היעדרויות"),
      e("div",{style:"font-size:9px;color:#475569"},"חופשה / מילואים")
    ]));
    wdDisplay.forEach(date => {
      const td = e("td",{style:"vertical-align:top;padding:4px 2px"});
      const dayAbs = S.vacations.filter(v =>
        v.status === "approved" && v.type !== "exam" &&
        date >= v.start_date && date <= v.end_date
      );
      const dayExams = S.vacations.filter(v =>
        v.type === "exam" && v.status === "approved" &&
        date >= v.start_date && date <= v.end_date
      );
      const dayBlocks = (S.availSubmissions||[]).filter(b => b.date === date);

      if (dayAbs.length === 0 && dayExams.length === 0 && dayBlocks.length === 0) {
        td.appendChild(e("div",{style:"font-size:10px;color:#334155;text-align:center;padding:4px"},"—"));
      } else {
        dayAbs.forEach(v => {
          const emp = getEmp(v.employee_id);
          if (!emp) return;
          const icon = v.type === "reserve" ? "🎖️" : "🌴";
          td.appendChild(e("div",{style:"font-size:10px;font-weight:700;color:#F59E0B;white-space:nowrap;margin-bottom:1px"},icon+" "+emp.name.split(" ")[0]));
        });
        dayExams.forEach(v => {
          const emp = getEmp(v.employee_id);
          if (!emp) return;
          td.appendChild(e("div",{style:"font-size:10px;font-weight:700;color:#10B981;white-space:nowrap;margin-bottom:1px"},"📝 "+emp.name.split(" ")[0]));
        });
        dayBlocks.forEach(b => {
          const emp = getEmp(b.employee_id);
          const sh = SHIFT_BY_ID[b.shift];
          if (!emp) return;
          td.appendChild(e("div",{style:"font-size:9px;color:#EF4444;white-space:nowrap;margin-bottom:1px"},"🚫 "+emp.name.split(" ")[0]+(sh?" "+sh.label:"")));
        });
      }
      absRow.appendChild(td);
    });
    tbody.appendChild(absRow);
  }

  SHIFTS.forEach(shift => {
    const row = e("tr");
    row.appendChild(e("td",{style:"border-right:2px solid "+shift.color+"44;padding-right:12px"},[
      e("div",{style:"font-weight:700;font-size:13px;color:"+shift.color},shift.label),
      e("div",{style:"font-size:10px;color:#475569;direction:ltr;text-align:right"},shift.start+"–"+shift.end)
    ]));
    wdDisplay.forEach(date => {
      const dayNum = new Date(date+"T00:00:00").getDay();
      const isWeekendDay = dayNum === 5 || dayNum === 6;
      // On Fri/Sat skip afternoon
      if (isWeekendDay && (shift.id === "afternoon" || shift.id === "morning2")) {
        row.appendChild(e("td",{style:"background:#0F172A44;cursor:default"},[
          e("div",{style:"font-size:9px;color:#334155;text-align:center;padding:10px 0"},"—")
        ]));
        return;
      }
      const empIds = S.schedule[date]?.[shift.id] || [];
      const isSel = S.selectedCell?.date===date && S.selectedCell?.shift===shift.id;
      const canEdit = isManager();
      const _isTouchDev = "ontouchstart" in window || navigator.maxTouchPoints > 0;
      const tdProps = {
        class: isSel ? "selected" : "",
        style: "--shift-color:"+shift.color+(canEdit?";cursor:pointer":";cursor:default"),
        onclick: () => {
          if (!canEdit) return;
          S.selectedCell = isSel ? null : {date, shift:shift.id};
          render();
        }
      };
      // Drag & drop target (desktop only)
      if (canEdit && !_isTouchDev) {
        tdProps.ondragover = (ev) => {
          ev.preventDefault();
          ev.dataTransfer.dropEffect = "move";
          ev.currentTarget.style.background = shift.color + "22";
          ev.currentTarget.style.outline = "2px dashed " + shift.color;
        };
        tdProps.ondragleave = (ev) => {
          // Only clear if leaving the cell entirely (not entering child element)
          if (!ev.currentTarget.contains(ev.relatedTarget)) {
            ev.currentTarget.style.background = "";
            ev.currentTarget.style.outline = "";
          }
        };
        tdProps.ondrop = async (ev) => {
          ev.preventDefault();
          ev.currentTarget.style.background = "";
          ev.currentTarget.style.outline = "";
          try {
            const data = JSON.parse(ev.dataTransfer.getData("text/plain"));
            const { empId, fromDate, fromShift } = data;
            // Same cell - do nothing
            if (fromDate === date && fromShift === shift.id) return;
            // Check if employee is already in target cell
            const targetIds = S.schedule[date]?.[shift.id] || [];
            if (targetIds.includes(empId)) {
              toast("העובד כבר משובץ למשמרת הזאת","err");
              return;
            }
            
            const empName = getEmp(empId)?.name || "העובד";
            const targetShiftLabel = shift.label;
            
            // CHECK 1: Block check - did this employee block this shift?
            const blockShiftId = (shift.id === "morning2") ? "morning" : shift.id;
            const empBlocked = S.availSubmissions.some(s =>
              s.employee_id === empId &&
              (s.slots||[]).some(sl => {
                if (sl.date && sl.date === date) return sl.shift === blockShiftId || sl.shift === shift.id;
                return false;
              })
            );
            if (empBlocked) {
              if (!(await uiConfirm({title:"העובד חסם משמרת זו", message:empName + " חסם את " + targetShiftLabel + " ביום זה.", tone:"warn", okLabel:"שבץ בכל זאת"}))) return;
            }
            
            // CHECK 2: Vacation/reserve/exam
            const vac = S.vacations.find(v=>v.employee_id===empId&&v.status==="approved"&&date>=v.start_date&&date<=v.end_date);
            if (vac) {
              const vacLabel = vac.type === "reserve" ? "מילואים" : vac.type === "exam" ? "מבחן" : "חופש";
              if (!(await uiConfirm({title:"העובד בהיעדרות", message:empName + " ב" + vacLabel + " בתאריך זה.", tone:"warn", okLabel:"שבץ בכל זאת"}))) return;
            }
            
            // CHECK 3: Cross-week rest (night yesterday → morning today)
            const crossConflict = await checkShiftConflictAsync(date, shift.id, empId, fromDate, fromShift);
            if (crossConflict) {
              if (!(await uiConfirm({title:"התנגשות שעות", message:crossConflict, tone:"warn", okLabel:"שבץ בכל זאת"}))) return;
            }
            
            // Snapshot for undo (any manual move should be undoable, just like click-assign).
            const dragEmpName = getEmp(empId)?.name?.split(" ")[0] || "עובד";
            pushScheduleHistory("העברת " + dragEmpName);

            // Remove from source
            if (S.schedule[fromDate] && S.schedule[fromDate][fromShift]) {
              S.schedule[fromDate][fromShift] = S.schedule[fromDate][fromShift].filter(id => id !== empId);
            }
            // Also drop the source's lock, if any — the manual decision moved with the chip.
            const oldLockKeyDrag = fromDate+"|"+fromShift;
            if (S.lockedSlots[oldLockKeyDrag]) S.lockedSlots[oldLockKeyDrag].delete(empId);
            // Add to target
            if (!S.schedule[date]) S.schedule[date] = {};
            if (!S.schedule[date][shift.id]) S.schedule[date][shift.id] = [];
            S.schedule[date][shift.id].push(empId);
            // Auto-lock: dragging is a manual assignment, protect from auto-schedule reset.
            const newLockKeyDrag = date+"|"+shift.id;
            if (!S.lockedSlots[newLockKeyDrag]) S.lockedSlots[newLockKeyDrag] = new Set();
            S.lockedSlots[newLockKeyDrag].add(empId);
            
            // Move custom hours and notes if exist
            const oldChKey = fromDate+"|"+fromShift+"|"+empId;
            const newChKey = date+"|"+shift.id+"|"+empId;
            if (S.customHours[oldChKey]) {
              S.customHours[newChKey] = S.customHours[oldChKey];
              delete S.customHours[oldChKey];
            }
            const oldNoteKey = fromDate+"|"+fromShift+"|"+empId;
            const newNoteKey = date+"|"+shift.id+"|"+empId;
            if (S.assignmentNotes[oldNoteKey]) {
              S.assignmentNotes[newNoteKey] = S.assignmentNotes[oldNoteKey];
              delete S.assignmentNotes[oldNoteKey];
            }
            
            invalidateMemo && invalidateMemo();
            render();
            saveScheduleToDB();
            if (typeof logAction === "function") {
              logAction("drag_drop_move", { empId, from:{date:fromDate,shift:fromShift}, to:{date,shift:shift.id} });
            }
            toast("הועבר ✓");
          } catch (err) {
            console.error("Drag drop error:", err);
            toast("שגיאה בגרירה: " + (err?.message || err), "err");
          }
        };
      }
      const td = e("td", tdProps);
      if (empIds.length === 0) {
        td.appendChild(div("cell-empty",["ריק"]));
      } else {
        empIds.forEach(empId => {
          const emp = getEmp(empId);
          if (!emp) return;
          const i = empIdx(empId);
          const col = ec(i);
          const ch = S.customHours[date+"|"+shift.id+"|"+empId];
          const isFilteredOut = S.schedFilter && S.schedFilter !== empId;
          const isHighlighted = S.schedFilter && S.schedFilter === empId;
          const chipProps = {class:"emp-chip",
            style:`background:${isHighlighted?col+"44":col+"22"};border:${isHighlighted?"2px":"1px"} solid ${isHighlighted?col:col+"44"};color:${col};opacity:${isFilteredOut?"0.2":"1"};${isHighlighted?"box-shadow:0 0 8px "+col+"44;":""};cursor:${isManager()?"grab":"default"}`
          };
          // Drag & drop only on desktop (not touch devices)
          const isTouchDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;
          if (isManager() && !isTouchDevice) {
            chipProps.draggable = "true";
            chipProps.ondragstart = (ev) => {
              ev.dataTransfer.setData("text/plain", JSON.stringify({empId:empId, fromDate:date, fromShift:shift.id}));
              ev.dataTransfer.effectAllowed = "move";
              ev.dataTransfer.dropEffect = "move";
              setTimeout(()=>{if(ev.target.style)ev.target.style.opacity="0.3";}, 0);
            };
            chipProps.ondragend = (ev) => { ev.target.style.opacity=""; };
          }
          // Parse note for tags and free text
          const noteKey = date+"|"+shift.id+"|"+empId;
          const rawNote = S.assignmentNotes[noteKey] || "";
          let chipTags = [];
          let chipNoteText = "";
          if (rawNote.startsWith("🏷️ ")) {
            const parts = rawNote.split(" | ");
            chipTags = parts[0].replace("🏷️ ","").split(", ").map(t=>t.trim()).filter(Boolean);
            chipNoteText = parts.slice(1).join(" | ");
          } else if (rawNote) {
            chipNoteText = rawNote;
          }
          
          // Always show hours: custom-per-employee if set, otherwise the shift's default.
          // Uses DAY_SHIFT_OVERRIDES so day-specific hours (Thu night 22:45-07:30,
          // Fri/Sat mornings with their own times) show correctly on each chip.
          const dowForChip = new Date(date+"T00:00:00").getDay();
          const overridesForChip = DAY_SHIFT_OVERRIDES[dowForChip];
          const shiftForHours = (overridesForChip && overridesForChip.find(s => s.id === shift.id)) || shift;
          const displayStart = ch?.start || shiftForHours.start;
          const displayEnd   = ch?.end   || shiftForHours.end;
          const hasCustom    = !!ch;

          const chip = e("div",chipProps,[
            // Name row with color dot
            e("div",{class:"emp-chip-row"},[
              e("span",{style:`width:6px;height:6px;border-radius:50%;background:${col};flex-shrink:0`},""),
              e("span",{style:"font-weight:700"},emp.name.split(" ")[0])
            ]),
            // Hours row — always visible. direction:ltr keeps "07:00-15:00" from reversing
            // to "15:00-07:00" inside the RTL app frame.
            e("div",{class:"emp-chip-hours",style:"direction:ltr;text-align:center;color:#F59E0B;font-weight:700"},[
              e("span",{style:"margin-left:3px"},"⏰"),
              displayStart + "–" + displayEnd
            ]),
            // System tags
            chipTags.length > 0 ? e("div",{class:"emp-chip-tags"},
              chipTags.map(t => e("span",{class:"emp-chip-tag"},"🏷️ "+t))
            ) : null,
            // Free-text note
            chipNoteText ? e("div",{class:"emp-chip-note"},"📝 "+chipNoteText) : null
          ]);
          td.appendChild(chip);
        });
      }
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  tbl.appendChild(tbody);
  gridWrap.appendChild(tbl);
  gridCard.appendChild(gridWrap);
  wrap.appendChild(gridCard);

  // Cell editor
  if (S.selectedCell) {
    wrap.appendChild(viewCellEditor(S.selectedCell.date, S.selectedCell.shift));
  }

  // Workload
  wrap.appendChild(viewWorkload(wd));
  return wrap;
}

function viewScheduleDayMobile(wd) {
  const wrap = e("div",{class:"sched-day-view",style:"display:block"});
  if (S.schedDayIdx == null || S.schedDayIdx < 0 || S.schedDayIdx > 6) S.schedDayIdx = 0;
  const date = wd[S.schedDayIdx];
  const dt = new Date(date+"T00:00:00");
  const isToday = date === today();
  const holiday = getHoliday(date);

  // Swipe navigation — swipe right → previous day, swipe left → next day.
  // Keeps the finger interaction natural on a phone: pull the calendar in the direction you want.
  let touchStartX = null, touchStartY = null;
  wrap.ontouchstart = (ev) => {
    if (ev.touches.length !== 1) { touchStartX = null; return; }
    touchStartX = ev.touches[0].clientX;
    touchStartY = ev.touches[0].clientY;
  };
  wrap.ontouchend = (ev) => {
    if (touchStartX == null) return;
    const endX = (ev.changedTouches[0]||{}).clientX;
    const endY = (ev.changedTouches[0]||{}).clientY;
    if (endX == null) return;
    const dx = endX - touchStartX;
    const dy = endY - touchStartY;
    touchStartX = null;
    // Threshold: 60px horizontal and mostly horizontal, otherwise ignore.
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    haptic(10);
    // In RTL the natural swipe: right → previous day, left → next day.
    if (dx > 0) {
      // Swipe right — previous day
      if (S.schedDayIdx > 0) { S.schedDayIdx--; render(); }
      else { S.weekOffset--; S.schedDayIdx = 6; loadSchedule().then(()=>render()); }
    } else {
      // Swipe left — next day
      if (S.schedDayIdx < 6) { S.schedDayIdx++; render(); }
      else { S.weekOffset++; S.schedDayIdx = 0; loadSchedule().then(()=>render()); }
    }
  };
  
  // Navigation row
  const navRow = e("div",{class:"sched-day-nav"},[
    btn("btn-sm btn-sm-gray","→",()=>{
      haptic(8);
      if (S.schedDayIdx > 0) { S.schedDayIdx--; render(); }
      else { 
        // Go to previous week's Saturday
        S.weekOffset--; S.schedDayIdx = 6; 
        loadSchedule().then(()=>render());
      }
    }),
    e("div",{style:"flex:1;text-align:center"},[
      e("div",{style:"font-weight:800;font-size:15px;color:"+(isToday?"#60A5FA":"#E2E8F0")},
        DAYS[dt.getDay()] + " " + dt.getDate() + "/" + (dt.getMonth()+1) + "/" + dt.getFullYear()),
      isToday ? e("div",{style:"font-size:10px;color:#60A5FA;font-weight:700;margin-top:2px"},"היום") : null,
      holiday ? e("div",{style:"font-size:10px;color:#FCD34D;font-weight:700;margin-top:2px"},"✡️ "+holiday) : null
    ]),
    btn("btn-sm btn-sm-gray","←",()=>{
      haptic(8);
      if (S.schedDayIdx < 6) { S.schedDayIdx++; render(); }
      else { 
        // Go to next week's Sunday
        S.weekOffset++; S.schedDayIdx = 0; 
        loadSchedule().then(()=>render());
      }
    })
  ]);
  wrap.appendChild(navRow);
  
  // Today shortcut
  if (!isToday) {
    wrap.appendChild(e("div",{style:"text-align:center;margin-bottom:10px"},[
      btn("btn-sm btn-sm-blue","← היום",()=>{
        const todayStr = today();
        const todayDt = new Date(todayStr+"T00:00:00");
        const curWeekStart = new Date(wd[0]+"T00:00:00");
        // Calculate offset from current week
        const diffMs = todayDt - curWeekStart;
        const diffDays = Math.floor(diffMs / (1000*60*60*24));
        if (diffDays >= 0 && diffDays < 7) {
          // In this week
          S.schedDayIdx = diffDays;
          render();
        } else {
          S.weekOffset = 0;
          S.schedDayIdx = todayDt.getDay();
          loadSchedule().then(()=>render());
        }
      })
    ]));
  }
  
  // Day card with shifts
  const dayCard = e("div",{class:"sched-day-card"});
  
  // Get absences for this day (managers only)
  if (isManager()) {
    const dayAbs = S.vacations.filter(v =>

    const dayBlocks = (S.availSubmissions||[]).filter(b =>

      dayAbs.forEach(v => {

      onclick: () => {

    // Employees in this shift
    const empsDiv = e("div",{class:"sched-day-shift-emps"});

    } else {

        let chipTags = [];

          chipTags.length > 0 ? e("div",{style:"display:flex;flex-wrap:wrap;gap:3px;margin-top:4px"},

function viewCellEditor(date, shiftId) {
  const shift = SHIFT_BY_ID[shiftId];
  const assignedIds = S.schedule[date]?.[shiftId] || [];
  const editor = div("cell-editor");
  editor.appendChild(e("div",{class:"cell-editor-title"},`✏️ ${shift.label} — ${fmtDate(date)}`));

  const btnWrap = e("div");
  schedulableEmployees().forEach((emp, idx) => {
    const col = ec(idx);
    const vac = S.vacations.find(v=>v.employee_id===emp.id&&v.status==="approved"&&date>=v.start_date&&date<=v.end_date);
    const onVac = !!vac;
    const vacIcon = vac?.type === "reserve" ? "🎖️" : vac?.type === "exam" ? "📝" : "🌴";
    const vacLabel = vac?.type === "reserve" ? "מילואים" : vac?.type === "exam" ? "מבחן" : "חופש";
    const isAssigned = assignedIds.includes(emp.id);
    const locked = S.lockedSlots[date+"|"+shiftId]?.has(emp.id);

    // Also dim employees who blocked this exact shift on this exact date, so at a glance
    // the manager sees who's available vs who chose not to. Kept clickable with a confirm.
    const blockShiftId = (shiftId === "morning2") ? "morning" : shiftId;
    const isBlocked = S.availSubmissions.some(s =>
      s.employee_id === emp.id &&
      (s.slots||[]).some(sl => sl.date === date && (sl.shift === blockShiftId || sl.shift === shiftId))
    );

    // Rest-between-shifts check: does the employee's previous shift (in this week's schedule
    // OR the previous week's, for Sun mornings after a Sat night) collide with this shift?
    // Same time-based logic the auto-scheduler uses — 8 hours is the legal floor.
    let restViolation = null;
    {
      // Reuses getShiftsForDate() so day-specific hour overrides (Thu-night 22:45-07:30,
      // Fri/Sat hours, etc.) apply consistently to rest-checks, not just to display.
      const dateStrForDefs = (dt) => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
      const findDef = (id, dt) => {
        const dayDefs = getShiftsForDate(dateStrForDefs(dt));
        return dayDefs.find(sh => sh.id === id) || SHIFTS.find(sh => sh.id === id);
      };
      const dObj = new Date(date+"T00:00:00");
      const thisDef = findDef(shiftId, dObj);
      if (thisDef) {
        const startHM = (thisDef.start || "07:00").split(":").map(Number);
        const shiftStartTs = dObj.getTime() + startHM[0]*3600000 + startHM[1]*60000;

        // Scan yesterday, today, AND tomorrow. We need tomorrow because: if I'm placing
        // "night" today, the END of my night (next morning ~07:00) may conflict with a
        // morning/morning2 shift tomorrow that was already assigned to this employee.
        const yesterday = new Date(dObj.getTime() - 86400000);
        const tomorrow = new Date(dObj.getTime() + 86400000);
        const daysToScan = [[yesterday, -1], [dObj, 0], [tomorrow, 1]];

        // Also compute THIS shift's end time for forward rest check
        const endHMThis = (thisDef.end || "00:00").split(":").map(Number);
        const endMinThis = endHMThis[0]*60 + endHMThis[1];
        const startMinThis = startHM[0]*60 + startHM[1];
        let shiftEndTs = dObj.getTime() + endHMThis[0]*3600000 + endHMThis[1]*60000;
        if (endMinThis <= startMinThis) shiftEndTs += 86400000; // this shift crosses midnight

        let minRest = Infinity;
        daysToScan.forEach(([d, _offset]) => {
          const dStr = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
          const daySched = S.schedule[dStr] || {};
          Object.keys(daySched).forEach(prevShiftId => {
            if (!(daySched[prevShiftId] || []).includes(emp.id)) return;
            if (dStr === date && prevShiftId === shiftId) return; // this exact slot doesn't count
            const prevSh = findDef(prevShiftId, d);
            if (!prevSh) return;
            const endHM = (prevSh.end || "00:00").split(":").map(Number);
            const startHM2 = (prevSh.start || "00:00").split(":").map(Number);
            const startMin = startHM2[0]*60 + startHM2[1];
            const endMin = endHM[0]*60 + endHM[1];
            let otherStartTs = d.getTime() + startHM2[0]*3600000 + startHM2[1]*60000;
            let otherEndTs = d.getTime() + endHM[0]*3600000 + endHM[1]*60000;
            if (endMin <= startMin) otherEndTs += 86400000; // other shift crosses midnight

            // Two measurements, keep the smaller:
            //   1) BACKWARD: rest between other shift ending and this one starting
            //   2) FORWARD:  rest between this shift ending and other one starting
            // The smaller of the two is the real violation if any.
            const restBackward = (shiftStartTs - otherEndTs) / 3600000;
            const restForward  = (otherStartTs - shiftEndTs) / 3600000;
            // Only consider shifts within 24h window on either side
            if (restBackward >= 0 && restBackward < 24 && restBackward < minRest) minRest = restBackward;
            if (restForward  >= 0 && restForward  < 24 && restForward  < minRest) minRest = restForward;
            // Overlap case (either direction < 0 means overlap)
            if (restBackward < 0 && restBackward > -24) minRest = Math.min(minRest, restBackward);
            if (restForward  < 0 && restForward  > -24) minRest = Math.min(minRest, restForward);
          });
        });

        // Round to one decimal before comparing — protects against float precision issues
        // where 7.0h could compute to 6.9999… and false-trigger the warning.
        const restRounded = Math.round(minRest * 10) / 10;
        if (minRest < 0 && minRest !== Infinity) {
          restViolation = "כבר משובץ למשמרת חופפת";
        } else if (restRounded < 7 && minRest !== Infinity) {
          restViolation = "פחות מ-7 שעות מנוחה (" + restRounded + " שעות)";
        }
        // 7 hours and above is legitimate — no warning at all.
      }
    }

    // Combined "dimmed" state — vacation, blocked shift, OR insufficient rest.
    const dimmedBecause = onVac ? vacLabel
      : (isBlocked ? "חסם משמרת זו"
      : (restViolation ? restViolation : null));
    const showDimmed = !!dimmedBecause && !isAssigned;

    const chip = e("button",{
      class:"cell-emp-btn"+(isAssigned?" assigned":""),
      style:`background:${isAssigned?col+"33":"#0F172A"};border:1px solid ${isAssigned?col:col+"44"};color:${col};opacity:${showDimmed ? 0.45 : 1}`,
      title: dimmedBecause ? emp.name+" — "+dimmedBecause : "",
      onclick:async ()=>{
        // If employee is on vacation/reserve/exam, ask for confirmation before assigning
        if (onVac && !isAssigned) {
          if (!(await uiConfirm({title:"העובד בהיעדרות", message:emp.name + " ב" + vacLabel + " בתאריך " + fmtDate(date), tone:"warn", okLabel:"שבץ בכל זאת"}))) return;
        }
        // Same for a shift they explicitly blocked
        if (isBlocked && !isAssigned) {
          if (!(await uiConfirm({title:"העובד חסם משמרת זו", message:emp.name + " ביקש לא לעבוד במשמרת זו.", tone:"warn", okLabel:"שבץ בכל זאת"}))) return;
        }
        // Same for insufficient rest between shifts
        if (restViolation && !isAssigned) {
          if (!(await uiConfirm({title:"בעיית מנוחה בין משמרות", message:emp.name + ": " + restViolation, tone:"warn", okLabel:"שבץ בכל זאת"}))) return;
        }
        toggleCellEmp(date, shiftId, emp.id);
      }
    },[
      e("span",{style:`width:7px;height:7px;border-radius:50%;background:${col}`},""),
      e("span",{},emp.name),
      onVac ? e("span",{style:"font-size:11px",title:vacLabel},vacIcon) : null,
      isBlocked && !onVac ? e("span",{style:"font-size:11px",title:"חסם משמרת זו"},"🚫") : null,
      restViolation && !onVac && !isBlocked ? e("span",{style:"font-size:11px",title:restViolation},"⏰") : null,
      locked ? e("span",{},"🔒") : null
    ]);
    btnWrap.appendChild(chip);

    if (isAssigned) {
      // Lock button
      const lockBtn = e("button",{
        class:"btn-icon",
        title: locked?"שחרר נעילה":"נעל שיבוץ",
        style:"margin-right:-8px;margin-left:4px",
        onclick: (ev) => { ev.stopPropagation(); toggleLock(date,shiftId,emp.id); }
      }, locked?"🔒":"🔓");
      btnWrap.appendChild(lockBtn);

      // Custom hours button
      const chKey = date+"|"+shiftId+"|"+emp.id;
      const existingCh = S.customHours[chKey];
      // Note button
      const noteKey = date+"|"+shiftId+"|"+emp.id;
      const existingNote = S.assignmentNotes[noteKey];
      const noteBtn = e("button",{
        class:"btn-icon",
        title:"הערה",
        style:"margin-right:-8px;margin-left:4px;font-size:12px;color:"+(existingNote?"#F59E0B":"#475569"),
        onclick: (ev) => {
          ev.stopPropagation();
          const editorId = "note-editor-"+noteKey.replace(/[|]/g,"_");
          const existingEditor = document.getElementById(editorId);
          if (existingEditor) { existingEditor.remove(); return; }
          
          // Parse existing note - separate system tags from free text
          // Format: "🏷️ Sys1, Sys2 | free text" or just plain
          let existingTags = [];
          let existingText = "";
          if (existingNote) {
            const parts = existingNote.split(" | ");
            if (parts[0].startsWith("🏷️ ")) {
              existingTags = parts[0].replace("🏷️ ","").split(", ").filter(x=>x.trim());
              existingText = parts.slice(1).join(" | ");
            } else {
              existingText = existingNote;
            }
          }
          
          const selectedTags = new Set(existingTags);
          const editorDiv = e("div",{
            id:editorId,
            style:"display:flex;flex-direction:column;gap:8px;background:#0F172A;border:1px solid #334155;border-radius:10px;padding:10px;margin:4px;width:100%;max-width:380px"
          });
          
          // System chips picker
          const systems = S.systems || [];
          if (systems.length > 0) {
            editorDiv.appendChild(e("div",{style:"font-size:10px;color:#64748B;font-weight:700"},"🏷️ בחר מערכות:"));
            const chipsRow = e("div",{style:"display:flex;flex-wrap:wrap;gap:4px"});
            systems.forEach(sys => {
              const isSel = selectedTags.has(sys);
              const chipBtn = e("button",{
                "data-sys":sys,
                style:`padding:4px 10px;border-radius:14px;border:1px solid ${isSel?"#3B82F6":"#334155"};background:${isSel?"#3B82F644":"#1E293B"};color:${isSel?"#60A5FA":"#94A3B8"};font-size:11px;font-weight:600;cursor:pointer;font-family:inherit`,
                onclick:(ev2)=>{
                  ev2.stopPropagation();
                  if (selectedTags.has(sys)) selectedTags.delete(sys);
                  else selectedTags.add(sys);
                  // Re-style this chip
                  const newSel = selectedTags.has(sys);
                  ev2.target.style.background = newSel?"#3B82F644":"#1E293B";
                  ev2.target.style.color = newSel?"#60A5FA":"#94A3B8";
                  ev2.target.style.borderColor = newSel?"#3B82F6":"#334155";
                }
              }, sys);
              chipsRow.appendChild(chipBtn);
            });
            editorDiv.appendChild(chipsRow);
          } else {
            editorDiv.appendChild(e("div",{style:"font-size:10px;color:#475569;font-style:italic"},"💡 הוסף מערכות בהגדרות לבחירה מהירה"));
          }
          
          // Free text input
          editorDiv.appendChild(e("div",{style:"font-size:10px;color:#64748B;font-weight:700;margin-top:4px"},"💬 הערה חופשית:"));
          const textInp = e("input",{
            type:"text",
            value:existingText,
            placeholder:"הערה (אופציונלי)",
            style:"background:#1E293B;border:1px solid #334155;border-radius:6px;color:#E2E8F0;font-size:13px;padding:6px 10px;font-family:inherit;width:100%;box-sizing:border-box",
            id:"note-inp-"+noteKey.replace(/[|]/g,"_")
          });
          editorDiv.appendChild(textInp);
          
          // Action buttons
          const btnRow = e("div",{style:"display:flex;gap:6px"});
          btnRow.appendChild(e("button",{
            style:"flex:1;background:#10B98122;border:1px solid #10B98144;color:#10B981;border-radius:6px;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer",
            onclick:(ev2)=>{
              ev2.stopPropagation();
              const txt = document.getElementById("note-inp-"+noteKey.replace(/[|]/g,"_")).value.trim();
              const tags = Array.from(selectedTags);
              let combined = "";
              if (tags.length > 0 && txt) combined = "🏷️ " + tags.join(", ") + " | " + txt;
              else if (tags.length > 0) combined = "🏷️ " + tags.join(", ");
              else combined = txt;
              if (combined) S.assignmentNotes[noteKey] = combined;
              else delete S.assignmentNotes[noteKey];
              saveScheduleToDB();
              toast("הערה נשמרה ✓");
              render();
            }
          },"💾 שמור"));
          btnRow.appendChild(e("button",{
            style:"background:#EF444422;border:1px solid #EF444444;color:#EF4444;border-radius:6px;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer",
            onclick:(ev2)=>{
              ev2.stopPropagation();
              delete S.assignmentNotes[noteKey];
              saveScheduleToDB();
              toast("הערה הוסרה");
              render();
            }
          },"מחק"));
          btnRow.appendChild(e("button",{
            style:"background:#64748B22;border:1px solid #64748B44;color:#94A3B8;border-radius:6px;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer",
            onclick:(ev2)=>{
              ev2.stopPropagation();
              document.getElementById(editorId)?.remove();
            }
          },"ביטול"));
          editorDiv.appendChild(btnRow);
          
          btnWrap.appendChild(editorDiv);
        }
      }, existingNote?"📝":"💬");
      btnWrap.appendChild(noteBtn);

      const hoursBtn = e("button",{
        class:"btn-icon",
        title:"ערוך שעות",
        style:"margin-right:-8px;margin-left:4px;font-size:12px;color:#94A3B8",
        onclick: (ev) => {
          ev.stopPropagation();
          // Use day-specific shift definition — Thu-night, Fri and Sat have different
          // hours than the generic weekday defaults.
          const sh = getShiftsForDate(date).find(s => s.id === shiftId) || SHIFT_BY_ID[shiftId];
          const curStart = existingCh?.start || sh.start;
          const curEnd = existingCh?.end || sh.end;
          // Show inline editor
          const existingEditor = document.getElementById("hours-editor-"+chKey.replace(/[|]/g,"_"));
          if (existingEditor) { existingEditor.remove(); return; }
          const editorDiv = e("div",{
            id:"hours-editor-"+chKey.replace(/[|]/g,"_"),
            style:"display:inline-flex;align-items:center;gap:6px;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:6px 10px;margin:4px"
          },[
            e("span",{style:"font-size:11px;color:#94A3B8"},emp.name.split(" ")[0]+":"),
            e("input",{type:"time",value:curStart,class:"fi",style:"font-size:12px;padding:6px 8px;border-radius:6px",
              id:"ch-start-"+chKey.replace(/[|]/g,"_")}),
            e("span",{style:"color:#475569;font-size:11px"},"—"),
            e("input",{type:"time",value:curEnd,class:"fi",style:"font-size:12px;padding:6px 8px;border-radius:6px",
              id:"ch-end-"+chKey.replace(/[|]/g,"_")}),
            e("button",{
              style:"background:#10B98122;border:1px solid #10B98144;color:#10B981;border-radius:6px;padding:3px 8px;font-size:11px;font-family:inherit;font-weight:700",
              onclick:(ev2)=>{
                ev2.stopPropagation();
                const s=document.getElementById("ch-start-"+chKey.replace(/[|]/g,"_")).value;
                const en=document.getElementById("ch-end-"+chKey.replace(/[|]/g,"_")).value;
                if(s&&en){S.customHours[chKey]={start:s,end:en};saveScheduleToDB();toast("שעות עודכנו ✓");render();}
              }
            },"שמור"),
            e("button",{
              style:"background:#EF444422;border:1px solid #EF444444;color:#EF4444;border-radius:6px;padding:3px 8px;font-size:11px;font-family:inherit;font-weight:700",
              onclick:(ev2)=>{
                ev2.stopPropagation();
                delete S.customHours[chKey];saveScheduleToDB();toast("שעות אופסו");render();
              }
            },"אפס")
          ]);
          btnWrap.appendChild(editorDiv);
        }
      }, "⏰");
      btnWrap.appendChild(hoursBtn);
    }
  });
  editor.appendChild(btnWrap);
  return editor;
}

function viewWorkload(wd) {
  const counts = {};
  S.employees.forEach(emp => { counts[emp.id] = 0; });
  wd.forEach(d => SHIFTS.forEach(sh => {
    (S.schedule[d]?.[sh.id]||[]).forEach(id => { counts[id] = (counts[id]||0)+1; });
  }));

  if (!S.schedFilter) S.schedFilter = null;
  const card = div("card",[
    e("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"},[
      e("div",{class:"card-title",style:"margin-bottom:0"},"עומס עובדים — השבוע"),
      S.schedFilter ? btn("btn-sm btn-sm-gray","✕ הסר פילטר",()=>{S.schedFilter=null;render();}) : null
    ])
  ]);
  schedulableEmployees().forEach((emp, idx) => {
    const count = counts[emp.id]||0;
    const max = emp.max_shifts_per_week||5;
    const pct = Math.min(Math.round((count/max)*100),100);
    const over = count > max;
    const col = ec(idx);
    const barColor = over?"#EF4444":pct>80?"#F59E0B":"#10B981";
    const isFiltered = S.schedFilter === emp.id;
    card.appendChild(div("workload-row",[
      div("workload-info",[
        e("div",{style:"display:flex;align-items:center;gap:7px;cursor:pointer",onclick:()=>{S.schedFilter=isFiltered?null:emp.id;render();}},[
          e("span",{style:`width:8px;height:8px;border-radius:50%;background:${col}`},""),
          e("span",{style:"font-size:13px;font-weight:"+(isFiltered?"800":"600")+";color:"+(isFiltered?"#60A5FA":"#E2E8F0")},emp.name),
          isFiltered ? e("span",{style:"font-size:10px;background:#3B82F622;color:#60A5FA;border:1px solid #3B82F644;border-radius:4px;padding:1px 5px"},"מסונן") : null,
          over ? e("span",{style:"font-size:10px;background:#EF444422;color:#EF4444;border:1px solid #EF444444;border-radius:4px;padding:1px 5px"},"חריגה!") : null
        ]),
        e("span",{style:"font-size:12px;color:"+(over?"#EF4444":"#94A3B8")},`${count}/${max}`)
      ]),
      div("workload-bar-bg",[
        e("div",{class:"workload-bar-fill",style:`width:${pct}%;background:${isFiltered?"#3B82F6":barColor}`})
      ])
    ]));
  });
  return card;
}

    const typeSel = e("div",{style:"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px"});

      typeSel.appendChild(e("button",{
        style:`padding:12px 8px;border-radius:12px;border:2px solid ${sel ? typeColors[type] : typeColors[type]+"44"};background:${sel ? typeColors[type]+"22" : "#0F172A"};color:${sel ? typeColors[type] : "#64748B"};font-family:inherit;font-weight:800;font-size:13px;cursor:pointer`,
        onclick: () => { S.newVac.type = type; render(); }
      },[
        e("div",{style:"font-size:20px;margin-bottom:4px"}, typeIcons[type]),
        e("div",{}, typeNames[type])
      ]));
    });
    addCard.appendChild(typeSel);

    // Clamp dates to a sane window: last 30 days (for retroactive sick-day entry)
    // through 2 years ahead. Prevents the iOS wheel from drifting back to 1950.
    const _vacMin = (() => {
      // Build the ISO string from the Israel-wall-clock Date's own fields —
      // never via .toISOString(), which reinterprets the Date as UTC and can
      // round back a day for times near Israel midnight.
      const d = israelNow(); d.setDate(d.getDate() - 30);
      return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    })();
    const _vacMax = (israelYear() + 2) + "-12-31";
    addCard.appendChild(div("form-row",[
      div("form-col",[
        e("label",{class:"form-label"},"מתאריך *"),
        e("input",{type:"date",class:"fi",min:_vacMin,max:_vacMax,value:S.newVac.startDate||"",
          onchange: ev => {
            S.newVac.startDate = ev.target.value;
            // Auto-fill end date = start date if empty — most vacations are single-day,
            // and this prevents the user from leaving endDate blank or picking the wrong year.
            if (!S.newVac.endDate || S.newVac.endDate < ev.target.value) {
              S.newVac.endDate = ev.target.value;
            }
            render();
          }
        })
      ]),
      div("form-col",[
        e("label",{class:"form-label"},"עד תאריך *"),

      ])
    ]));

    if (S.newVac.startDate && S.newVac.endDate) {
      const dayDiff = Math.round((new Date(S.newVac.endDate+"T00:00:00") - new Date(S.newVac.startDate+"T00:00:00")) / 86400000) + 1;
      const tooLong = dayDiff > 90;

      addCard.appendChild(e("div",{style:`padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px;font-weight:600;background:${tooLong ? "#EF444422" : "#10B98122"};color:${tooLong ? "#FCA5A5" : "#86EFAC"};border:1px solid ${tooLong ? "#EF444466" : "#10B98144"}`},
        tooLong
          ? `⚠️ טווח חריג: ${dayDiff} ימים${weirdYear ? " (חוצה שנה — בדוק שהשנה נכונה!)" : ""}`

      // Sanity check: anything over 90 days is almost always a data-entry error (wrong year

      const dayDiff = Math.round((new Date(S.newVac.endDate+"T00:00:00") - new Date(S.newVac.startDate+"T00:00:00")) / 86400000) + 1;
      if (dayDiff > 90) {

  }

  wrap.appendChild(addCard);

  // ── בקשות ממתינות לאישור ──
  const pending = S.vacations.filter(v => v.status === "pending" && getEmp(v.employee_id));
