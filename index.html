// ── Edit / cancel approved vacations ──
async function editApprovedVacation(vac) {
  const types = { vacation: "חופשה", reserve: "מילואים", exam: "מבחן" };
  const emp = getEmp(vac.employee_id);
  const empName = emp?.name || "עובד";
  
  // Prompt for new dates
  const newStart = await uiPrompt({title:"עריכת תאריך התחלה", message:"עובד: " + empName + "\nסוג: " + (types[vac.type] || "חופשה"), defaultValue:vac.start_date, placeholder:"YYYY-MM-DD"});
  if (!newStart) return;
  
  // Validate date format
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newStart)) {
    toast("פורמט תאריך לא תקין", "err");
    return;
  }
  
  const newEnd = await uiPrompt({title:"עריכת תאריך סיום", defaultValue:vac.end_date, placeholder:"YYYY-MM-DD"});
  if (!newEnd) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newEnd)) {
    toast("פורמט תאריך לא תקין", "err");
    return;
  }
  
  if (newEnd < newStart) {
    toast("תאריך סיום חייב להיות אחרי תאריך התחלה", "err");
    return;
  }
  
  const newReason = await uiPrompt({title:"סיבה / הערה", message:"טקסט חופשי (אופציונלי)", defaultValue:vac.reason || ""});
  if (newReason === null) return; // cancelled
  
  // Update in DB
  const { error } = await sb.from("vacations").update({
    start_date: newStart,
    end_date: newEnd,
    reason: newReason || null
  }).eq("id", vac.id);
  
  if (error) {
    toast("עדכון נכשל — " + friendlyError(error), "err");
    return;
  }
  
  if (typeof logAction === "function") {
    logAction("vacation_edited", {
      vacation_id: vac.id,
      employee_id: vac.employee_id,
      old_dates: vac.start_date + " — " + vac.end_date,
      new_dates: newStart + " — " + newEnd
    });
  }
  
  await loadVacations();
  toast("✓ ההעדרות עודכנה");
  render();
}

async function cancelApprovedVacation(vac) {
  const types = { vacation: "חופשה", reserve: "מילואים", exam: "מבחן" };
  const emp = getEmp(vac.employee_id);
  const empName = emp?.name || "עובד";
  const typeLabel = types[vac.type] || "חופשה";
  
  if (!(await uiConfirm({title:`לבטל ${typeLabel}?`, message:empName + "\nתאריכים: " + fmtDate(vac.start_date) + (vac.start_date !== vac.end_date ? " — " + fmtDate(vac.end_date) : "") + "\n\nההיעדרות תימחק מהמערכת.", tone:"danger", okLabel:"בטל היעדרות"}))) return;
  
  // Delete from DB
  const { error } = await sb.from("vacations").delete().eq("id", vac.id);
  
  if (error) {
    toast("ביטול נכשל — " + friendlyError(error), "err");
    return;
  }
  
  if (typeof logAction === "function") {
    logAction("vacation_cancelled", {
      vacation_id: vac.id,
      employee_id: vac.employee_id,
      type: vac.type,
      dates: vac.start_date + " — " + vac.end_date
    });
  }
  
  await loadVacations();
  toast("✓ ההעדרות בוטלה");
  render();
}

// ── SWAPS ──
async function processManagerDecision(swap, isApproved, rejectReason) {
  if (isApproved) {
    // אימות אחרון לפני אישור בסידור
    if (swap.target_date && swap.giver_id) { // חילוף הדדי
      // מקבל המשמרת (העובד השני) מקבל את המשמרת שלך, ומתעלמים מהמשמרת שהוא מוסר
      const c1 = checkShiftConflict(swap.date, swap.shift, swap.taker_id, swap.target_date, swap.target_shift);
      // אתה (מוסר המשמרת) מקבל את המשמרת שלו, ומתעלמים מהמשמרת שאתה מוסר
      const c2 = checkShiftConflict(swap.target_date, swap.target_shift, swap.giver_id, swap.date, swap.shift);
      
      if (c1) { toast("לא ניתן לאשר: "+c1,"err"); return; }
      if (c2) { toast("לא ניתן לאשר: "+c2,"err"); return; }
      
      const empsA = S.schedule[swap.date]?.[swap.shift];
      if (empsA) { const i = empsA.indexOf(swap.giver_id); if (i > -1) empsA[i] = swap.taker_id; }
      const empsB = S.schedule[swap.target_date]?.[swap.target_shift];
      if (empsB) { const i = empsB.indexOf(swap.taker_id); if (i > -1) empsB[i] = swap.giver_id; }
    } else if (swap.giver_id) { // מסירת משמרת
      const c = checkShiftConflict(swap.date, swap.shift, swap.taker_id);
      if (c) { toast("לא ניתן לאשר: "+c,"err"); return; }
      const emps = S.schedule[swap.date]?.[swap.shift];
      if (emps) { const i = emps.indexOf(swap.giver_id); if (i > -1) emps[i] = swap.taker_id; }
    } else { // הצטרפות למשמרת
      const c = checkShiftConflict(swap.date, swap.shift, swap.taker_id);
      if (c) { toast("לא ניתן לאשר: "+c,"err"); return; }
      const emps = S.schedule[swap.date]?.[swap.shift];
      if (emps && !emps.includes(swap.taker_id)) emps.push(swap.taker_id);
    }
    saveScheduleToDB();
  }

  const swapUpdate = {status: isApproved?"approved":"rejected"};
  if (rejectReason) swapUpdate.reject_reason = rejectReason;
  const { data: swUpd, error: swErr } = await sb.from("swaps").update(swapUpdate).eq("id", swap.id).select("id,status").maybeSingle();
  if (swErr || !swUpd || swUpd.status !== swapUpdate.status) {
    toast("❌ הפעולה נכשלה: " + (swErr?.message || "לא ניתן לאמת את העדכון"), "err");
    return;
  }
  if (typeof logAction === "function") {
    logAction(isApproved ? "swap_approved" : "swap_rejected", {
      swap_id: swap.id,
      giver_id: swap.giver_id,
      taker_id: swap.taker_id,
      date: swap.date,
      shift: swap.shift,
      target_date: swap.target_date || null,
      target_shift: swap.target_shift || null,
      reject_reason: rejectReason || null
    });
  }

  const taker = getEmp(swap.taker_id);
  if (taker?.email) {
    const sh = SHIFT_BY_ID[swap.shift];
    sendEmail(
      "swap_decision", 
      taker.email,
      {
        empName: taker.name,
        targetDate: swap.target_date ? fmtDate(swap.date) + " ⇆ " + fmtDate(swap.target_date) : fmtDate(swap.date),
        shiftLabel: sh?.label || swap.shift,
        statusText: isApproved ? "אושרה" : "נדחתה",
        isApproved: isApproved,
        rejectReason: rejectReason||""
      }
    );
  }

  toast(isApproved ? "✓ אושר ועודכן בסידור" : "נדחה");
  await loadSwapRequests();
  render();
  silentRefresh();
}

// ── אישור/דחייה של העובד השני (Peer) ──
async function processPeerDecision(swap, isApproved) {
  const newStatus = isApproved ? "pending_manager" : "rejected";
  const { error } = await sb.from("swaps").update({status: newStatus}).eq("id", swap.id);
  if (error) { toast(friendlyError(error), "err"); return; }
  if (typeof logAction === "function") {
    logAction(isApproved ? "swap_peer_approved" : "swap_peer_rejected", {
      swap_id: swap.id,
      giver_id: swap.giver_id,
      taker_id: swap.taker_id,
      date: swap.date,
      shift: swap.shift
    });
  }

  // אם העובד אישר, עכשיו שולחים את המייל למנהל!
  if (isApproved) {
    const allMgrs = getNotifiedManagers();
    const giverEmp = getEmp(swap.giver_id);
    const takerEmp = getEmp(swap.taker_id);
    const sh = SHIFT_BY_ID[swap.shift];
    const tSh = SHIFT_BY_ID[swap.target_shift];
    
    allMgrs.forEach(adminEmp => {
      let shiftLabel = "";
      let tDateStr = fmtDate(swap.date);
      
      if (swap.target_date) {
        shiftLabel = "החלפה הדדית בין " + giverEmp?.name + " ל-" + takerEmp?.name;
        tDateStr = fmtDate(swap.date) + " (" + sh?.label + ") ⇆ " + fmtDate(swap.target_date) + " (" + tSh?.label + ")";
      } else {
        shiftLabel = sh?.label + " — מסירה מ-" + giverEmp?.name + " ל-" + takerEmp?.name;
      }

     let emailTitle = swap.target_date ? "🔄 בקשת החלפה הדדית" : "📤 בקשת מסירת משמרת";
      sendEmail("swap_request", adminEmp.email, {
        title: emailTitle, // <--- הוספנו כותרת
        requesterName: "הודעת מערכת",
        targetDate: tDateStr,
        shiftLabel: shiftLabel,
        note: swap.note || ""
      });
    });
    toast("אישרת את הבקשה! הועבר לאישור מנהל ✓");
  } else {
    toast("דחית את הבקשה");
  }
  
  await loadSwapRequests();
  render();
  silentRefresh();
}

// Cache for schedule data loaded for swap weeks (other than current)
const _swapWeekCache = {};  // { weekStartStr: { date: { shift: [empIds] } } }

async function loadScheduleForSwapWeek(weekOffset) {
  const wd = getWeekDates(weekOffset);
  const weekStart = wd[0];
  
  // If it's the current week being viewed in schedule, just use S.schedule
  if (weekOffset === S.weekOffset) {
    return S.schedule;
  }
  
  // Check cache
  if (_swapWeekCache[weekStart]) {
    return _swapWeekCache[weekStart];
  }
  
  // Load from DB
  try {
    const { data: sched } = await sb.from("schedules")
      .select("id").eq("business_id", S.profile.business_id)
      .eq("week_start", weekStart).maybeSingle();
    
    if (!sched) {
      _swapWeekCache[weekStart] = {};
      return {};
    }
    
    const { data: assigns } = await sb.from("assignments")
      .select("*").eq("schedule_id", sched.id);
    
    const result = {};
    (assigns || []).forEach(a => {
      if (!result[a.date]) result[a.date] = {};
      if (!result[a.date][a.shift]) result[a.date][a.shift] = [];
      result[a.date][a.shift].push(a.employee_id);
    });
    
    _swapWeekCache[weekStart] = result;
    return result;
  } catch (err) {
    console.warn("Could not load swap week:", err);
    return {};
  }
}

// Invalidate swap cache when schedule changes
function invalidateSwapCache() {
  for (const key in _swapWeekCache) delete _swapWeekCache[key];
}

    const availableShifts = [];
    Object.keys(S.schedule).filter(d=>inSwapWeek(d)).sort().forEach(date=>{

              date,shift:shift.id,
              status:"pending_manager"
            }]);
            if(error){toast(friendlyError(error),"err");return;}
            await loadSwapRequests();
            getNotifiedManagers().forEach(adminEmp2 => {

              sendEmail("swap_request",adminEmp2.email,{
                title: "➕ בקשת הצטרפות למשמרת", 
                requesterName: viewingEmp?.name || "עובד",
                targetDate: fmtDate(date),
                shiftLabel: (shift.label + " (" + shift.start + "–" + shift.end + ")"),
                note: ""
              });
            });
            toast("הבקשה נשלחה למנהל ✓");render();
          })
        ]));
      });
    }
    wrap.appendChild(card);
  }

  // ── סטטוס הבקשות שהגשתי ──
  const myReqs = S.swaps.filter(s=>s.giver_id===myEmpId||s.taker_id===myEmpId);
  if(myReqs.length>0){
    const sCard = div("card",[e("div",{style:"font-weight:700;font-size:13px;color:#64748B;margin-bottom:10px"},"⏳ הבקשות שלי")]);
    myReqs.slice(0,10).forEach(s=>{
      const sh=SHIFT_BY_ID[s.shift];
      
      let badgeClass = "pending";
      let badgeText = "ממתין";
      if (s.status === "approved") { badgeClass = "approved"; badgeText = "אושר"; }
      else if (s.status === "rejected") { badgeClass = "rejected"; badgeText = "נדחה"; }
      else if (s.status === "pending_peer") { badgeClass = "pending"; badgeText = "ממתין לעובד"; }
      else if (s.status === "pending_manager") { badgeClass = "pending"; badgeText = "ממתין למנהל"; }

      sCard.appendChild(e("div",{style:"display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #0F172A"},[

        e("span",{class:"status-badge status-"+badgeClass}, badgeText)
      ]));

    wrap.appendChild(sCard);
  }

  return wrap;
}

// ── EMPLOYEE VIEW ──
function viewEmpView() {
  const wrap = e("div",{style:"width:100%"});
  const selfOnly = S.profile?.role === "employee" || S.testAsEmployee;

  // If employee, force self view
  if (selfOnly && !S.empViewId) S.empViewId = S.user.id;

  if (selfOnly) {
    // Employee sees only their own data — no picker
    wrap.appendChild(div("page-title",["📋 המשמרות שלי"],{style:"margin-bottom:14px"}));
  } else {
    // Manager sees picker for all employees + test mode toggle
    wrap.appendChild(div("section-header",[
      div("page-title",["👤 תצוגת עובד"]),
      e("div",{style:"display:flex;align-items:center;gap:8px"},[
        e("span",{style:"font-size:12px;color:#64748B"},"מצב בדיקה:"),
        e("button",{
          style:`padding:6px 14px;border-radius:8px;border:1px solid ${S.testAsEmployee?"#10B981aa":"#334155"};background:${S.testAsEmployee?"#10B98122":"#1E293B"};color:${S.testAsEmployee?"#10B981":"#64748B"};font-family:inherit;font-size:12px;font-weight:700`,
          onclick:()=>{ S.testAsEmployee=!S.testAsEmployee; if(S.testAsEmployee&&!S.empViewId) S.empViewId=S.employees[0]?.id; render(); }
        },S.testAsEmployee?"✅ פעיל — לחץ לביטול":"הפעל")
      ])
    ],{style:"margin-bottom:14px"}));
    const picker = e("div",{style:"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px"});
    S.employees.forEach((emp,idx) => {
      const col = ec(idx);
      const sel = S.empViewId===emp.id;
      picker.appendChild(btn("",emp.name.split(" ")[0],()=>{S.empViewId=emp.id;S.empViewTab="shifts";render();},{
        style:`padding:7px 14px;border-radius:10px;border:1px solid ${sel?col+"cc":col+"44"};background:${sel?col+"33":"#1E293B"};color:${sel?col:"#94A3B8"};font-family:inherit;font-weight:${sel?"700":"500"};font-size:13px`
      }));
    });
    wrap.appendChild(picker);
  }

  const emp = S.employees.find(e=>e.id===S.empViewId);
  if (!emp) {
    wrap.appendChild(div("card",[e("div",{style:"text-align:center;padding:40px;color:#64748B"},["בחר עובד לצפייה"])]));
    return wrap;
  }

  const idx = empIdx(emp.id);
  const col = ec(idx);
  const wd = getWeekDates(S.weekOffset);
  const weekStart = wd[0];
  const isPublished = S.publishedWeeks.has(weekStart);

  // Emp card
  wrap.appendChild(e("div",{style:`background:#1E293B;border:1px solid ${col}44;border-radius:16px;padding:18px;margin-bottom:14px`},[
    e("div",{style:"display:flex;align-items:center;gap:14px"},[
      e("div",{style:`width:48px;height:48px;border-radius:14px;background:${col}22;border:1px solid ${col}44;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:${col};flex-shrink:0`},
        emp.name.split(" ").map(n=>n[0]).join("").slice(0,2)),
      e("div",{style:"flex:1"},[
        e("div",{style:"font-weight:800;font-size:17px;color:#E2E8F0"},emp.name),
        e("div",{style:"font-size:12px;color:#64748B;margin-top:2px"},emp.role==="admin"||emp.role==="manager"?"מנהל":"עובד"),
        emp.email?e("div",{style:"font-size:11px;color:#475569;margin-top:2px"},"✉️ "+emp.email):null
      ])
    ])
  ]));

  // Test mode banner
  if (S.testAsEmployee) {
    wrap.appendChild(e("div",{style:"background:#F59E0B18;border:1px solid #F59E0B44;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px"},[
      e("div",{style:"display:flex;align-items:center;gap:8px"},[
        e("span",{},"⚠️"),
        e("span",{style:"font-size:13px;color:#FCD34D;font-weight:600"},"מצב בדיקה — רואה כמו עובד")
      ]),
      btn("btn-sm btn-sm-gray","צא",()=>{S.testAsEmployee=false;render();})
    ]));
  }

  // ═══ In-app deadline banner ═══
  // Replaces the "I'll check the email when I remember" problem. Shows an urgent
  // banner on the employee home screen when the blocks deadline is within 24 hours
  // AND this user hasn't submitted yet for the upcoming week.
  try {
    const dlDay = S.business?.deadline_day;
    const dlTime = S.business?.deadline_time || "20:00";
    if (dlDay != null && selfOnly) {
      // Deadline is business-local (Israel). Compare "now" and the upcoming
      // deadline in Israel's wall clock so an employee abroad sees the correct
      // countdown — the business's Thursday 20:00, not their device's.
      const now = israelNow();
      const [dlH, dlM] = dlTime.split(":").map(Number);
      const upcoming = israelNow();
      const daysUntil = (parseInt(dlDay) - now.getDay() + 7) % 7;
      upcoming.setDate(now.getDate() + daysUntil);
      upcoming.setHours(dlH||0, dlM||0, 0, 0);
      if (upcoming <= now) upcoming.setDate(upcoming.getDate() + 7);
      const hoursToDeadline = (upcoming - now) / 3600000;
      // Only show when deadline is within 24 hours
      if (hoursToDeadline > 0 && hoursToDeadline < 24) {
        // Target week = Sunday of the week after the deadline
        const targetSun = new Date(upcoming);
        targetSun.setDate(targetSun.getDate() + (7 - upcoming.getDay()) % 7);
        if (upcoming.getDay() !== 0) targetSun.setDate(upcoming.getDate() + ((0 - upcoming.getDay() + 7) % 7 || 7));
        // Build the ISO string from Israel-local fields — .toISOString() would
        // reinterpret the Israel-wall-clock Date as UTC and can round to the
        // previous day for times near midnight, aiming at the wrong week.
        const targetSunStr = targetSun.getFullYear() + "-" + String(targetSun.getMonth()+1).padStart(2,"0") + "-" + String(targetSun.getDate()).padStart(2,"0");
        const hasSubmitted = (S.availSubmissions || []).some(a =>
          a.employee_id === emp.id && a.week_start === targetSunStr
        );
        if (!hasSubmitted) {
          const hrsLeft = Math.floor(hoursToDeadline);
          const minsLeft = Math.floor((hoursToDeadline - hrsLeft) * 60);
          const urgency = hoursToDeadline < 3;
          wrap.appendChild(e("div",{style:`background:${urgency?"#EF444422":"#F59E0B22"};border:1px solid ${urgency?"#EF444466":"#F59E0B66"};border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer`,
            onclick: () => { S.empViewTab = "avail"; render(); }
          },[
            e("div",{style:"display:flex;align-items:center;gap:10px;flex:1"},[
              e("span",{style:"font-size:24px"}, urgency ? "🚨" : "⏰"),
              e("div",{},[
                e("div",{style:`font-weight:800;font-size:14px;color:${urgency?"#FCA5A5":"#FCD34D"}`},
                  urgency ? "דחוף! עוד "+hrsLeft+"ש "+minsLeft+"ד" : "דדליין חסימות עוד "+hrsLeft+" שעות"),
                e("div",{style:"font-size:12px;color:#94A3B8;margin-top:2px"},"עדיין לא הגשת חסימות לשבוע הבא")
              ])
            ]),
            e("span",{style:"font-size:13px;color:"+(urgency?"#FCA5A5":"#FCD34D")+";font-weight:700"},"הגש עכשיו ←")
          ]));
        }
      }
    }
  } catch(_){}

  // Tabs
  const tabs = [["shifts","📋 המשמרות שלי"],["schedule","📅 סידור"],["mymonth","📆 החודש שלי"],["avail","🚫 חסימה"],["vacation","🌴 היעדרויות"],["swaps_emp","🔄 חילופים"]];
  wrap.appendChild(e("div",{class:"emp-view-tabs"},tabs.map(([id,lbl])=>
    btn("ev-tab"+(S.empViewTab===id?" active":""),lbl,()=>{S.empViewTab=id;render();})
  )));

  if (S.empViewTab==="shifts") {

    // Preload the current + next week into S.schedule (merge, never overwrite other weeks)
    // so the "Next Shift" countdown card has access to the real upcoming shifts even when
    // the user navigates to a different week-offset. Runs once per tab-open, then caches.
    if (!S._nextShiftPreloaded || Date.now() - S._nextShiftPreloaded > 60000) {
      S._nextShiftPreloaded = Date.now();
      (async () => {
        try {
          const needDates = [getWeekDates(0)[0], getWeekDates(1)[0]];
          const { data: scheds } = await sb.from("schedules")
            .select("id,week_start")
            .eq("business_id", S.profile.business_id)
            .eq("published", true)
            .in("week_start", needDates);
          const schedIds = (scheds||[]).map(s => s.id);
          if (schedIds.length === 0) return;
          const { data: assigns } = await sb.from("assignments")
            .select("date,shift,employee_id,custom_start,custom_end")
            .in("schedule_id", schedIds)
            .eq("employee_id", emp.id);
          let changed = false;
          (assigns||[]).forEach(a => {
            if (!S.schedule[a.date]) S.schedule[a.date] = {};
            if (!S.schedule[a.date][a.shift]) S.schedule[a.date][a.shift] = [];
            if (!S.schedule[a.date][a.shift].includes(a.employee_id)) {
              S.schedule[a.date][a.shift].push(a.employee_id);
              changed = true;
            }
            if (a.custom_start && a.custom_end) {
              S.customHours[a.date+"|"+a.shift+"|"+a.employee_id] = { start: a.custom_start.slice(0,5), end: a.custom_end.slice(0,5) };
            }
          });
          if (changed) render();
        } catch (err) { console.warn("Next-shift preload failed:", err); }
      })();
    }

    // Hero greeting — with gradient accent bar (RTL)
    {
      const g = getTimeBasedGreeting();
      const firstName = (getActiveProfile()?.name||"").split(" ")[0];
      const dayLabel = new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      wrap.appendChild(e("div",{style:"position:relative;margin-bottom:24px;padding:4px 0"},[
        e("div",{style:"position:absolute;top:6px;right:-22px;bottom:6px;width:4px;border-radius:4px;background:linear-gradient(180deg,#3B82F6 0%,#A855F7 50%,#EC4899 100%);box-shadow:0 0 16px rgba(99,102,241,0.5)"}),
        e("div",{style:"font-size:11px;color:#64748B;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px"}, dayLabel),
        e("div",{style:"font-weight:900;font-size:32px;letter-spacing:-1.1px;line-height:1.1;background:linear-gradient(180deg,#F8FAFC 0%,#CBD5E1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text"},
          g.text+", "+firstName+" "+g.emoji
        ),
      ]));
    }

    // Per-employee calendar reminder preference. When the final schedule is published,
    // an .ics file is attached to the email; this picks whether/how early the device
    // alarm should fire before each shift. Saved to profiles.shift_reminder_minutes.
    {
      const myEmpForPref = (typeof getActiveProfile==="function") ? getActiveProfile() : emp;
      if (myEmpForPref) {
        const currentMin = myEmpForPref.shift_reminder_minutes ?? null;

          // (Previously a note-only submission only emailed the manager and was never stored, so it never
          //  appeared in the blocks panel.)
          const slots = selKeys.map(k=>{
            const [di,shId]=k.split("|");
            return {day:new Date(targetDates[parseInt(di)]+"T00:00:00").getDay(),shift:shId,date:targetDates[parseInt(di)],reason:""};
          });
          await submitAvailability(emp.id, targetStart, slots, specialMsg || "חסימות");
          S.availDraft={}; S.blockReasons={};
          toast("נשלח בהצלחה ✓"); render();
        },{style:"flex:1"}),
        btn("btn-sm btn-sm-gray","נקה",()=>{S.availDraft={};S.blockReasons={};S._draftCleared=true;render();})
      ],{style:"margin-top:12px"}));
    }

    wrap.appendChild(card);

    } // end deadline else

    // History — all past submissions
    const myPastSubs = (S.availSubmissions||[]).filter(b=>b.employee_id===emp.id);
    const myPastBlocks = myPastSubs;
    if (myPastSubs.length > 0) {
      const histCard = div("card",[
        e("div",{style:"font-weight:800;font-size:14px;color:#94A3B8;margin-bottom:12px"},"📜 חסימות שהגשת בעבר")
      ]);

      myPastSubs.sort((a,b) => (b.week_start||"").localeCompare(a.week_start||"")).forEach(sub => {
        const wk = sub.week_start;
        histCard.appendChild(e("div",{style:"font-weight:700;font-size:12px;color:#60A5FA;margin-bottom:6px;margin-top:10px"},
          "שבוע " + (wk ? fmtDate(wk) : "לא ידוע")));

        const slotsGrid = e("div",{style:"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"});
        const SHIFT_ORDER_PAST = { morning: 0, morning2: 1, afternoon: 2, night: 3 };
        (sub.slots||[]).slice().sort((a,b) => {
          const dateCmp = (a.date||"").localeCompare(b.date||"");
          if (dateCmp !== 0) return dateCmp;
          return (SHIFT_ORDER_PAST[a.shift] ?? 99) - (SHIFT_ORDER_PAST[b.shift] ?? 99);
        }).forEach(sl => {
          const sh = SHIFT_BY_ID[sl.shift];
          const dt = sl.date ? new Date(sl.date+"T00:00:00") : null;
          const dayLabel = dt ? (DAYS[dt.getDay()]+" "+dt.getDate()+"/"+(dt.getMonth()+1)) : ("יום "+(DAYS[sl.day]||sl.day));
          slotsGrid.appendChild(e("div",{style:"background:#1E293B;border:1px solid "+(sh?.color||"#64748B")+"44;border-radius:8px;padding:6px 10px"},[
            e("div",{style:"font-weight:700;font-size:11px;color:"+(sh?.color||"#94A3B8")},dayLabel),
            e("div",{style:"font-size:10px;color:"+(sh?.color||"#64748B")},sh?.label||sl.shift),
            sl.reason ? e("div",{style:"font-size:9px;color:#FCA5A5;margin-top:2px"},"💬 "+sl.reason) : null
          ]));
        });
        histCard.appendChild(slotsGrid);

        if (sub.note) {
          histCard.appendChild(e("div",{style:"font-size:11px;color:#F59E0B;font-style:italic;margin-bottom:8px"},"📩 "+sub.note));
        }
      });
      wrap.appendChild(histCard);
    }

  }

  else if (S.empViewTab==="vacation") {
    wrap.appendChild(viewEmpVacations());
  }
  else if (S.empViewTab==="swaps_emp") {
    wrap.appendChild(viewSwaps(true));
  }

  return wrap;
}

// ── CONSTRAINTS MODAL ──
function viewConstraintsModal() {
  const emp = S.constraintsEmp;
  if (!emp) return null;

  const WEEKDAYS = ["ראשון","שני","שלישי","רביעי","חמישי"];
  const WEEKEND = ["שישי","שבת"];

  let localDC = JSON.parse(JSON.stringify(emp.day_constraints||{}));
  let localMax = emp.max_shifts_per_week||5;
  let localPerShift = JSON.parse(JSON.stringify(emp.max_per_shift||{}));
  let localAvail = [...(emp.availability||DAYS)];
  let localPref = [...(emp.preferred_shifts||[])];
  let localActiveDays = [...(emp.active_days || [0,1,2,3,4,5,6])]; // 0=Sun..6=Sat
  let localWorkShifts = [...(emp.allowed_shifts || SHIFTS.map(s=>s.id))];
  let localFixedShifts = JSON.parse(JSON.stringify(emp.fixed_shifts || {}));
  let localExcludeFrom = emp.exclude_from || null;
  let localExcludeTo = emp.exclude_to || null;
  let localExcludeReason = emp.exclude_reason || "";
  let localMaxBlocks = emp.max_blocks_per_week ?? 99;
  let localBlockLimits = JSON.parse(JSON.stringify(emp.block_limits || {
    weekday: { morning: 3, afternoon: 3, night: 1 },

  let localAllowedBlocks = JSON.parse(JSON.stringify(emp.allowed_block_slots||{}));

  const modal = div("modal");
  const mh = div("modal-header",[
    div("modal-title",[`הגבלות — ${emp.name}`]),
    btn("modal-close","✕",()=>{S.constraintsEmp=null;render();})
  ]);
  modal.appendChild(mh);

  function rebuildModal() {
    // Clear and rebuild
    while(modal.childNodes.length>1) modal.removeChild(modal.lastChild);

    // Max shifts
    const r1 = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:6px"},"מקסימום משמרות בשבוע"),
      e("div",{style:"display:flex;align-items:center;gap:10px"},[
        e("input",{class:"fi",type:"number",min:1,max:21,value:localMax,style:"width:80px;text-align:center",
          oninput:ev=>{localMax=parseInt(ev.target.value)||1;}}),
        e("span",{style:"font-size:13px;color:#64748B"},"משמרות")
      ])
    ],{style:"margin-bottom:12px"});
    modal.appendChild(r1);

    // ── Active days ──
    const daysCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"📅 ימים פעילים"),
      e("div",{style:"font-size:11px;color:#475569;margin-bottom:10px"},"בחר באילו ימים העובד עובד — ימים לא פעילים לא יישובצו אוטומטית")
    ],{style:"margin-bottom:12px"});
    const daysGrid = e("div",{style:"display:flex;flex-wrap:wrap;gap:6px"});
    DAYS.forEach((dayName, dayIdx) => {
      const isActive = localActiveDays.includes(dayIdx);
      daysGrid.appendChild(e("button",{
        style:`padding:10px 14px;border-radius:10px;border:1px solid ${isActive?"#10B981":"#334155"};background:${isActive?"#10B98122":"#0F172A"};color:${isActive?"#10B981":"#475569"};font-family:inherit;font-weight:700;font-size:13px;cursor:pointer`,
        onclick:()=>{
          if(isActive) localActiveDays = localActiveDays.filter(d=>d!==dayIdx);
          else localActiveDays.push(dayIdx);
          rebuildModal();
        }
      },isActive ? "✓ "+dayName : dayName));
    });
    daysCard.appendChild(daysGrid);
    modal.appendChild(daysCard);

    // ── Allowed shifts ──
    const shiftsCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"🕐 משמרות מותרות"),
      e("div",{style:"font-size:11px;color:#475569;margin-bottom:10px"},"למשל: עובד שעובד רק בוקר — בטל את הסימון מצהריים ולילה")
    ],{style:"margin-bottom:12px"});
    const shiftsGrid = e("div",{style:"display:flex;gap:8px"});
    SHIFTS.forEach(sh => {
      const isAllowed = localWorkShifts.includes(sh.id);
      shiftsGrid.appendChild(e("button",{
        style:`flex:1;padding:14px 10px;border-radius:12px;border:2px solid ${isAllowed?sh.color:sh.color+"33"};background:${isAllowed?sh.color+"22":"#0F172A"};color:${isAllowed?sh.color:"#475569"};font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;text-align:center`,
        onclick:()=>{
          if(isAllowed) localWorkShifts = localWorkShifts.filter(s=>s!==sh.id);
          else localWorkShifts.push(sh.id);
          rebuildModal();
        }
      },[
        e("div",{style:"font-size:20px;margin-bottom:4px"},isAllowed?"✓":"✗"),
        e("div",{},sh.label)
      ]));
    });
    shiftsCard.appendChild(shiftsGrid);
    modal.appendChild(shiftsCard);

    // ── Fixed schedule ──
    const fixedCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"📌 שיבוץ קבוע"),
      e("div",{style:"font-size:11px;color:#475569;margin-bottom:10px"},"העובד ישובץ אוטומטית בימים ובמשמרות שתבחר — תמיד, בכל שבוע")
    ],{style:"margin-bottom:12px"});
    if (!localFixedShifts) localFixedShifts = {};
    // Day-by-day cards layout (mobile friendly)
    const FIXED_SHIFTS = [
      { id:"morning", label:"בוקר", color:"#F59E0B" },
      { id:"afternoon", label:"צהריים", color:"#10B981" },
      { id:"night", label:"לילה", color:"#6366F1" },
    ];
    DAYS.forEach((dayName, dayIdx) => {
      const isWE = dayIdx >= 5;
      const dayShifts = isWE ? FIXED_SHIFTS.filter(sh=>sh.id!=="afternoon") : FIXED_SHIFTS;
      const dayRow = e("div",{style:"background:#0F172A;border:1px solid #334155;border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between"});
      dayRow.appendChild(e("div",{style:"font-weight:700;font-size:13px;color:"+(isWE?"#A855F7":"#E2E8F0")+";min-width:50px"},dayName));
      const btnsWrap = e("div",{style:"display:flex;gap:6px;flex-wrap:wrap"});
      dayShifts.forEach(sh => {
        // "morning" button controls both morning and morning2
        const key = dayIdx + "_" + sh.id;
        const key2 = sh.id === "morning" ? dayIdx + "_morning2" : null;
        const isFixed = !!localFixedShifts[key] || (key2 && !!localFixedShifts[key2]);
        btnsWrap.appendChild(e("button",{
          style:"padding:8px 14px;border-radius:8px;border:1px solid "+(isFixed?sh.color:sh.color+"33")+";background:"+(isFixed?sh.color+"22":"#1E293B")+";color:"+(isFixed?sh.color:"#475569")+";font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap",
          onclick:()=>{
            if(isFixed) {
              delete localFixedShifts[key];
              if(key2) delete localFixedShifts[key2];
            } else {
              localFixedShifts[key] = true;
              if(key2) localFixedShifts[key2] = true;
            }
            rebuildModal();
          }
        },(isFixed?"✓ ":"")+sh.label));
      });
      dayRow.appendChild(btnsWrap);
      fixedCard.appendChild(dayRow);
    });
    const fixedCount = Object.values(localFixedShifts).filter(Boolean).length;
    if (fixedCount > 0) {
      fixedCard.appendChild(e("div",{style:"margin-top:8px;font-size:11px;color:#10B981;font-weight:700"},"📌 "+fixedCount+" משמרות קבועות הוגדרו"));
    }
    modal.appendChild(fixedCard);

    // ── Temporary exclusion ──
    const exCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"🚑 השעיה זמנית מהסידור"),
      e("div",{style:"font-size:11px;color:#475569;margin-bottom:10px"},"העובד לא יישובץ בתאריכים אלו (מחלה, חל״ת, וכו׳)")
    ],{style:"margin-bottom:12px"});
    // Date limits: today through 2 years ahead. Picker opens on today when both
    // inputs are empty, so a stale saved value from a past exclusion doesn't drag
    // the iOS picker back to that old month.
    const _todayIso = israelTodayIso();
    const _dateMin = _todayIso;
    const _dateMax = (israelYear() + 2) + "-12-31";
    // If the previously saved exclusion range already ended, treat it as stale
    // and present a blank form so the picker opens on today instead of jumping
    // back half a year to the old value.
    if (localExcludeTo && localExcludeTo < _todayIso) {
      localExcludeFrom = null;
      localExcludeTo = null;
      localExcludeReason = "";
    }
    // Live summary element — a reference we mutate on every input change so the
    // red "מושעה" banner reflects what the user just typed without waiting for a
    // full modal rebuild.
    const _exSummaryEl = e("div",{style:"margin-top:10px;background:#EF444418;border:1px solid #EF444433;border-radius:8px;padding:8px 12px;font-size:12px;color:#FCA5A5;display:none"},"");
    const _refreshExSummary = () => {
      if (localExcludeFrom && localExcludeTo) {
        _exSummaryEl.textContent = "🚑 מושעה: " + fmtDate(localExcludeFrom) + " — " + fmtDate(localExcludeTo) + (localExcludeReason ? " (" + localExcludeReason + ")" : "");
        _exSummaryEl.style.display = "";
      } else {
        _exSummaryEl.textContent = "";
        _exSummaryEl.style.display = "none";
      }
    };
    exCard.appendChild(div("form-row",[
      div("form-col",[
        e("label",{class:"form-label"},"מתאריך"),
        e("input",{class:"fi",type:"date",min:_dateMin,max:_dateMax,value:localExcludeFrom||"",oninput:ev=>{localExcludeFrom=ev.target.value||null;_refreshExSummary();}})
      ]),
      div("form-col",[
        e("label",{class:"form-label"},"עד תאריך"),
        e("input",{class:"fi",type:"date",min:_dateMin,max:_dateMax,value:localExcludeTo||"",oninput:ev=>{localExcludeTo=ev.target.value||null;_refreshExSummary();}})
      ])
    ]));
    exCard.appendChild(e("input",{class:"fi",placeholder:"סיבה (מחלה, חל״ת...)",value:localExcludeReason,style:"margin-top:8px",
      oninput:ev=>{localExcludeReason=ev.target.value;_refreshExSummary();}}));
    exCard.appendChild(_exSummaryEl);
    _refreshExSummary();
    exCard.appendChild(btn("btn-sm btn-sm-gray","נקה השעיה",()=>{localExcludeFrom=null;localExcludeTo=null;localExcludeReason="";rebuildModal();},{style:"margin-top:8px"}));
    modal.appendChild(exCard);

    // Per shift limits removed - handled by block_limits

    // ── Block limits per day group ──
    const limCard = div("card",[
      e("div",{class:"form-label",style:"margin-bottom:10px"},"🚫 כמות חסימות מותרת לעובד")
    ],{style:"margin-bottom:12px"});

    // Weekday limits (Sun-Thu)
    limCard.appendChild(e("div",{style:"font-weight:700;font-size:13px;color:#3B82F6;margin-bottom:8px"},"ראשון — חמישי"));
    limCard.appendChild(e("div",{style:"display:flex;gap:10px;margin-bottom:14px"},BLOCK_SHIFTS.map(sh => 
      div("form-col",[
        e("label",{style:"font-size:11px;font-weight:700;color:"+sh.color},sh.label),
        e("input",{class:"fi",type:"number",min:0,max:5,value:localBlockLimits.weekday?.[sh.id]??3,style:"text-align:center",
          oninput:ev=>{if(!localBlockLimits.weekday)localBlockLimits.weekday={};localBlockLimits.weekday[sh.id]=parseInt(ev.target.value)||0;}})
      ])
    )));

    // Weekend limits (Fri-Sat) — only morning + night (no afternoon)
    limCard.appendChild(e("div",{style:"font-weight:700;font-size:13px;color:#A855F7;margin-bottom:8px"},"שישי — שבת"));
    limCard.appendChild(e("div",{style:"display:flex;gap:10px;margin-bottom:8px"},BLOCK_SHIFTS.filter(sh=>sh.id!=="afternoon").map(sh => 
      div("form-col",[
        e("label",{style:"font-size:11px;font-weight:700;color:"+sh.color},sh.label),
        e("input",{class:"fi",type:"number",min:0,max:2,value:localBlockLimits.weekend?.[sh.id]??1,style:"text-align:center",
          oninput:ev=>{if(!localBlockLimits.weekend)localBlockLimits.weekend={};localBlockLimits.weekend[sh.id]=parseInt(ev.target.value)||0;}})
      ])
    )));
    limCard.appendChild(e("div",{style:"font-size:11px;color:#475569"},"0 = אסור לחסום כלל"));
    modal.appendChild(limCard);

    // Block slots are now controlled by block_limits above

    // Actions
    modal.appendChild(div("form-actions",[
      btn("btn-add","שמור הגבלות",async()=>{
        await saveConstraints(emp.id,{maxShifts:localMax,blockLimits:localBlockLimits,activeDays:localActiveDays,allowedShifts:localWorkShifts,excludeFrom:localExcludeFrom,excludeTo:localExcludeTo,excludeReason:localExcludeReason,fixedShifts:localFixedShifts});
      },{style:"flex:1"}),
      btn("btn-sm btn-sm-gray","ביטול",()=>{S.constraintsEmp=null;render();})
    ]));
  }

  rebuildModal();
  return div("modal-bg",[modal],{onclick:ev=>{if(ev.target.classList.contains("modal-bg")){S.constraintsEmp=null;render();}}});
}

        e("div",{style:"display:flex;gap:6px"},[

            publishWeek("preview");

  ],{onclick:ev=>{if(ev.target.classList.contains("modal-bg")){

  const currentOffset = S.weekOffset;
  // Show options: -2, -1, 0, +1, +2 weeks
  const offsets = [-3, -2, -1, 0, 1, 2];
  const exportTypeLabel = exportType === "pdf" ? "PDF" : exportType === "csv" ? "CSV" : "WhatsApp";
  
  return div("modal-bg",[
    div("modal",[
      div("modal-header",[
        div("modal-title",[(exportType === "whatsapp" ? "📲" : "📤") + ` שליחה ל-${exportTypeLabel} — בחר שבוע`]),
        btn("modal-close","✕",()=>{S.showExportModal=null;render();})
      ]),
      e("div",{style:"color:#64748B;font-size:13px;margin-bottom:16px"}, "אפשר לייצא גם סידור שעוד עובדים עליו"),
      
      e("div",{style:"display:flex;flex-direction:column;gap:8px;margin-bottom:16px"},
        offsets.map(off => {
          const wd = getWeekDates(off);
          const isCurrent = off === currentOffset;
          const isPast = off < 0;
          const isFuture = off > 0;
          let label = "";
          if (off === 0) label = "השבוע הזה";
          else if (off === -1) label = "שבוע שעבר";
          else if (off === 1) label = "שבוע הבא";
          else if (off < 0) label = `לפני ${Math.abs(off)} שבועות`;
          else label = `עוד ${off} שבועות`;
          
          return e("button",{
            style:`width:100%;text-align:right;padding:14px;background:${isCurrent?"#3B82F622":"#0F172A"};border:1px solid ${isCurrent?"#3B82F6":"#334155"};border-radius:12px;color:#E2E8F0;font-family:inherit;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center;transition:all 0.15s`,
            onmouseover:(ev)=>{ev.currentTarget.style.borderColor="#60A5FA";ev.currentTarget.style.background="#3B82F611";},
            onmouseout:(ev)=>{ev.currentTarget.style.borderColor=isCurrent?"#3B82F6":"#334155";ev.currentTarget.style.background=isCurrent?"#3B82F622":"#0F172A";},
            onclick:async()=>{
              S.showExportModal = null;
              render();
              if (exportType === "pdf") await exportSchedulePDF(off);
              else if (exportType === "csv") await exportScheduleCSV(off);
              else await exportScheduleWhatsApp(off);
            }
          },[
            e("div",{},[
              e("div",{style:"font-weight:700;margin-bottom:2px"},[
                label,
                isCurrent ? e("span",{style:"font-size:10px;background:#3B82F644;color:#60A5FA;border-radius:4px;padding:2px 6px;margin-right:6px"},"נוכחי") : null
              ]),
              e("div",{style:"font-size:11px;color:#64748B"},`${fmtDate(wd[0])} — ${fmtDate(wd[6])}`)
            ]),
            e("span",{style:"font-size:18px;color:#64748B"},"←")
          ]);
        })
      ),
      
      btn("btn-sm btn-sm-gray","ביטול",()=>{S.showExportModal=null;render();},{style:"width:100%"})
    ])
  ],{onclick:ev=>{if(ev.target.classList.contains("modal-bg")){S.showExportModal=null;render();}}});
}

function viewPublishModal() {
  const wd = getWeekDates(S.weekOffset);
  const weekStart = wd[0];
  const currentType = S.schedPublishType?.[weekStart];
  const isInitialPublished = S.publishedInitial?.has(weekStart);
  const isFinalPublished = S.publishedWeeks.has(weekStart);

  return div("modal-bg",[
    div("modal",[
      div("modal-header",[
        div("modal-title",["📢 פרסום סידור"]),
        btn("modal-close","✕",()=>{S.showPublishModal=false;render();})
      ]),
      e("div",{style:"color:#64748B;font-size:13px;margin-bottom:16px"},
        `שבוע ${fmtDate(wd[0])} — ${fmtDate(wd[6])}`),

      // Preview card (managers only)
      e("div",{style:"background:#A855F708;border:1px solid #A855F744;border-radius:14px;padding:16px;margin-bottom:12px"},[
        e("div",{style:"display:flex;align-items:center;gap:10px;margin-bottom:8px"},[
          e("span",{style:"font-size:22px"},"📝"),
          e("div",{},[
            e("div",{style:"font-weight:800;font-size:15px;color:#E2E8F0"},"שליחה ניסיונית"),
            e("div",{style:"font-size:12px;color:#64748B"},"רק למנהלים — לבדיקה לפני פרסום רשמי")
          ])
        ]),
        btn("btn-purple","📝 שלח למנהלים לבדיקה",()=>publishWeek("preview"),{style:"width:100%"})
      ]),

      // Initial publish card — with optional "visible until" deadline so employees stop
      // seeing it when the manager starts tweaking the schedule for the final version.
      e("div",{style:`background:#1E3A5F22;border:1px solid ${isInitialPublished?"#3B82F6":"#334155"};border-radius:14px;padding:16px;margin-bottom:12px`},[
        e("div",{style:"display:flex;align-items:center;gap:10px;margin-bottom:8px"},[
          e("span",{style:"font-size:22px"},"📋"),
          e("div",{},[
            e("div",{style:"font-weight:800;font-size:15px;color:#E2E8F0"},"סידור ראשוני"),
            e("div",{style:"font-size:12px;color:#64748B"},"ניתן לשינוי לאחר פרסום · עובדים יקבלו מייל עם הערה")
          ]),
          isInitialPublished ? e("span",{style:"font-size:11px;background:#3B82F622;color:#60A5FA;border:1px solid #3B82F644;border-radius:6px;padding:2px 8px"},"פורסם") : null
        ]),
        // Visibility deadline picker — if set, employees stop seeing the schedule after this
        // time, so when the manager starts working on the final version there's no "spoiler".
        e("div",{style:"background:#0F172A66;border:1px solid #334155;border-radius:10px;padding:10px;margin-bottom:10px"},[
          e("label",{style:"display:flex;align-items:center;gap:8px;font-size:12px;color:#94A3B8;cursor:pointer;margin-bottom:6px"},[
            e("input",{type:"checkbox",checked:!!S.publishVisibleUntil,
              onchange:ev=>{
                if (ev.target.checked) {
                  // Default: Thursday 20:00 of this week
                  const def = new Date(wd[4]+"T20:00:00");
                  const pad = n => String(n).padStart(2,"0");
                  S.publishVisibleUntil = def.getFullYear()+"-"+pad(def.getMonth()+1)+"-"+pad(def.getDate())+"T"+pad(def.getHours())+":"+pad(def.getMinutes());
                } else {
                  S.publishVisibleUntil = null;
                }
                render();
              }
            }),
            e("span",{},"⏰ זמין לצפייה רק עד תאריך/שעה מסוימים")
          ]),
          S.publishVisibleUntil ? e("input",{class:"fi",type:"datetime-local",value:S.publishVisibleUntil,
            style:"width:100%;font-size:13px",
            oninput:ev=>{S.publishVisibleUntil=ev.target.value;}
          }) : null,
          S.publishVisibleUntil ? e("div",{style:"font-size:10px;color:#64748B;margin-top:4px;line-height:1.4"},
            "אחרי הזמן הזה, העובדים יראו \"הסידור בהכנה — יפורסם בקרוב\" עד שתפרסם סופית.") : null
        ]),
        btn("btn-add", isInitialPublished?"📋 פרסם מחדש (ראשוני)":"📋 פרסם ראשוני",
          ()=>publishWeek("initial"),{style:"width:100%"})
      ]),

      // Final publish card
      e("div",{style:`background:#10B98108;border:1px solid ${isFinalPublished?"#10B981":"#334155"};border-radius:14px;padding:16px;margin-bottom:16px`},[
        e("div",{style:"display:flex;align-items:center;gap:10px;margin-bottom:8px"},[
          e("span",{style:"font-size:22px"},"📢"),
          e("div",{},[
            e("div",{style:"font-weight:800;font-size:15px;color:#E2E8F0"},"סידור סופי"),
            e("div",{style:"font-size:12px;color:#64748B"},"נעול · עובדים יקבלו מייל סופי")
          ]),
          isFinalPublished ? e("span",{style:"font-size:11px;background:#10B98122;color:#10B981;border:1px solid #10B98144;border-radius:6px;padding:2px 8px"},"פורסם") : null
        ]),
        btn("btn-green", isFinalPublished?"📢 פרסם מחדש (סופי)":"📢 פרסם סופי",
          ()=>publishWeek("final"),{style:"width:100%"})
      ]),

      btn("btn-sm btn-sm-gray","ביטול",()=>{S.showPublishModal=false;render();},{style:"width:100%"})
    ])
  ],{onclick:ev=>{if(ev.target.classList.contains("modal-bg")){S.showPublishModal=false;render();}}});
}

// ══════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════
// SETTINGS VIEW
// ══════════════════════════════════════════════════════
function viewSettings() {
  const wrap = e("div");
  wrap.appendChild(div("page-title",["⚙️ הגדרות"],{style:"margin-bottom:16px"}));

  // ═══ אבטחה — 2FA ═══
  const secCard = div("card",[e("div",{class:"card-title"},"🔐 אבטחה")]);

  // Load MFA state once per settings-view mount
  if (S.securityCardState === undefined) {
    S.securityCardState = "loading";
    (async () => {
      try {
        const { data: factors } = await sb.auth.mfa.listFactors();
        S.securityCardState = { hasMfa: (factors?.totp || []).length > 0 };
      } catch (err) {
        S.securityCardState = { error: err.message };
      }
      render();
    })();
  }

  if (S.securityCardState === "loading") {
    secCard.appendChild(e("div",{style:"padding:10px;color:#94A3B8;font-size:13px"},"טוען..."));
  } else if (S.securityCardState?.error) {
    secCard.appendChild(e("div",{style:"padding:10px;color:#F87171;font-size:13px"},"שגיאה: " + S.securityCardState.error));
  } else {
    const hasMfa = S.securityCardState.hasMfa;
    secCard.appendChild(e("div",{style:"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"},[
      e("div",{style:"flex:1;min-width:180px"},[
        e("div",{style:"font-size:14px;font-weight:700;color:#E2E8F0;margin-bottom:4px"},"אימות דו-שלבי (2FA)"),
        hasMfa
          ? e("div",{style:"font-size:12px;color:#34D399"}, "✓ מופעל — Authenticator")
          : e("div",{style:"font-size:12px;color:#F87171"}, "⚠ לא מופעל")
      ]),
      hasMfa
        ? btn("btn-sm btn-sm-red","🔁 הגדר מחדש", async () => {
            const ok = await uiConfirm({title:"הגדר מחדש 2FA?", message:"פעולה זו תמחק את ה-Authenticator הנוכחי ותחייב סריקה מחדש של QR.", confirmText:"כן, הגדר מחדש", tone:"danger"});
            if (!ok) return;
            try {
              const { data: factors } = await sb.auth.mfa.listFactors();
              for (const f of (factors?.totp || [])) {
                await sb.auth.mfa.unenroll({ factorId: f.id });
              }
              toast("2FA נוטרל. יופעל שוב בכניסה הבאה.");
              S.securityCardState = { hasMfa: false };
              S.mfaEnrollData = null;
              S.view = "mfa_enroll";
              render();
            } catch (err) {
              toast(friendlyError(err), "err");
            }
          },{style:"padding:8px 14px"})
        : e("div",{style:"font-size:11px;color:#94A3B8"}, "נדרש לפעולות רגישות")
    ]));
  }
  wrap.appendChild(secCard);

  // ═══ איפוס 2FA לעובד (מנהל בלבד) ═══
  if (isManager()) {
    const resetCard = div("card",[e("div",{class:"card-title"},"🔓 איפוס 2FA לעובד")]);
    resetCard.appendChild(e("div",{style:"font-size:12px;color:#94A3B8;margin-bottom:12px;line-height:1.5"},
      "אם עובד איבד את הטלפון או החליף מכשיר — אפס את ה-2FA שלו. בכניסה הבאה הוא יסרוק QR חדש."));
    const empSel = e("select",{class:"fi",style:"margin-bottom:10px",
      onchange: ev => { S.resetMfaEmpId = ev.target.value; }
    });
    empSel.appendChild(e("option",{value:""},"— בחר עובד —"));
    S.employees.filter(em => em.id !== S.user.id).sort((a,b) => a.name.localeCompare(b.name,"he")).forEach(em => {
      empSel.appendChild(e("option",{value:em.id, selected: S.resetMfaEmpId === em.id ? "selected" : null}, em.name));
    });
    resetCard.appendChild(empSel);
    resetCard.appendChild(btn("btn-sm btn-sm-red","🔓 אפס 2FA", async () => {
      if (!S.resetMfaEmpId) return toast("בחר עובד","err");
      const emp = getEmp(S.resetMfaEmpId);
      const ok = await uiConfirm({
        title:"אפס 2FA של "+emp.name+"?",
        message:"הוא יצטרך לסרוק QR חדש בכניסה הבאה. אל תעשה את זה אם אתה לא בטוח שבאמת הוא זה שביקש.",
        confirmText:"כן, אפס",
        tone:"danger"
      });
      if (!ok) return;
      try {
        const { data, error } = await sb.functions.invoke("admin-reset-mfa", { body: { empId: S.resetMfaEmpId } });
        if (error) throw error;
        toast("2FA של " + emp.name + " אופס ✓");
        S.resetMfaEmpId = "";
        render();
      } catch (err) {
        toast(friendlyError(err), "err");
      }
    },{style:"width:100%;padding:12px"}));
    wrap.appendChild(resetCard);
  }

  if (!S.settingsData) S.settingsData = {
    morningStart: SHIFTS[0].start, morningEnd: SHIFTS[0].end,
    morning2Start: SHIFTS[1].start, morning2End: SHIFTS[1].end,
    afternoonStart: SHIFTS[2].start, afternoonEnd: SHIFTS[2].end,
    nightStart: SHIFTS[3].start, nightEnd: SHIFTS[3].end,
    emailNotify: true,
  };
  const sd = S.settingsData;

  // Shift hours settings
  const shiftCard = div("card",[e("div",{class:"card-title"},"🕐 שעות משמרות")]);
  // Which shift types are relevant for THIS business — self-service (any admin), not just the platform super admin.
  const SHIFT_TYPE_LABELS = { morning:"בוקר", morning2:"בוקר ב׳", afternoon:"צהריים", night:"לילה" };
  const weekdaySelSet = new Set(S.business?.shift_config?.weekday_shifts || ["morning","morning2","afternoon","night"]);
  const weekendSelSet = new Set(S.business?.shift_config?.weekend_shifts || ["morning","night"]);
  const shiftTypesCard = div("card",[e("div",{class:"card-title"},"🎛️ אילו משמרות רלוונטיות לעסק שלכם")]);
  shiftTypesCard.appendChild(e("div",{style:"font-size:12px;color:#94A3B8;margin-bottom:12px"},
    "לא כל עסק צריך את כל סוגי המשמרות (למשל: אין משמרת לילה), ובסופ״ש לפעמים רלוונטיות פחות משמרות מאשר בימי חול."));

  shiftTypesCard.appendChild(e("div",{style:"font-size:11px;color:#64748B;margin-bottom:6px"},"ימי חול (א׳-ה׳)"));
  const wdTypesWrap = e("div",{style:"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px"});
  Object.keys(SHIFT_TYPE_LABELS).forEach(key=>{
    const isOn = weekdaySelSet.has(key);
    wdTypesWrap.appendChild(e("label",{style:`display:flex;align-items:center;gap:6px;background:#0F172A;border:1px solid ${isOn?"#3B82F6aa":"#334155"};border-radius:10px;padding:8px 12px;cursor:pointer`},[
      e("input",{type:"checkbox",checked:isOn?"checked":null,
        onchange:(ev)=>{ if(ev.target.checked) weekdaySelSet.add(key); else weekdaySelSet.delete(key); }
      }),
      e("span",{style:"font-size:13px;color:#E2E8F0"}, SHIFT_TYPE_LABELS[key])
    ]));
  });
  shiftTypesCard.appendChild(wdTypesWrap);

  shiftTypesCard.appendChild(e("div",{style:"font-size:11px;color:#64748B;margin-bottom:6px"},"שישי-שבת"));
  const weTypesWrap = e("div",{style:"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px"});
  Object.keys(SHIFT_TYPE_LABELS).forEach(key=>{
    const isOn = weekendSelSet.has(key);
    weTypesWrap.appendChild(e("label",{style:`display:flex;align-items:center;gap:6px;background:#0F172A;border:1px solid ${isOn?"#F59E0Baa":"#334155"};border-radius:10px;padding:8px 12px;cursor:pointer`},[
      e("input",{type:"checkbox",checked:isOn?"checked":null,
        onchange:(ev)=>{ if(ev.target.checked) weekendSelSet.add(key); else weekendSelSet.delete(key); }
      }),
      e("span",{style:"font-size:13px;color:#E2E8F0"}, SHIFT_TYPE_LABELS[key])
    ]));
  });
  shiftTypesCard.appendChild(weTypesWrap);

  shiftTypesCard.appendChild(btn("btn-add","💾 שמור אילו משמרות רלוונטיות",async()=>{
    if (weekdaySelSet.size === 0) { toast("בחר לפחות סוג משמרת אחד לימי חול", "err"); return; }
    const shiftConfig = { weekday_shifts: Array.from(weekdaySelSet), weekend_shifts: Array.from(weekendSelSet) };
    const { error } = await sb.from("businesses").update({ shift_config: shiftConfig }).eq("id", S.profile.business_id);
    if (error) { toast("שמירה נכשלה — " + friendlyError(error), "err"); return; }
    S.business.shift_config = shiftConfig;
    toast("✓ נשמר — ייכנס לתוקף בכניסה הבאה למערכת");
    render();
  },{style:"width:100%"}));
  wrap.appendChild(shiftTypesCard);

  const shiftDefs = [
    {id:"morning",label:"בוקר",sk:"morning"},
    {id:"morning2",label:"בוקר ב׳",sk:"morning2"},
    {id:"afternoon",label:"צהריים",sk:"afternoon"},
    {id:"night",label:"לילה",sk:"night"},
  ];
  shiftDefs.forEach(sh=>{
    const shColor = SHIFT_BY_ID[sh.id]?.color || "#94A3B8";
    shiftCard.appendChild(e("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#0F172A;border-radius:10px;padding:8px 12px;border:1px solid "+shColor+"33"},[
      e("div",{style:"font-weight:700;font-size:12px;color:"+shColor+";min-width:55px"},sh.label),
      // Explicit visual layout: START field on the right (with "מ-" label), END on the left (with "עד" label)
      e("div",{style:"flex:1;display:flex;flex-direction:column;gap:2px"},[
        e("div",{style:"font-size:10px;color:#64748B;text-align:center"},"מ־"),
        e("input",{type:"time",value:sd[sh.sk+"Start"]||SHIFT_BY_ID[sh.id]?.start||"07:00",class:"fi",style:"padding:8px 10px;font-size:14px;text-align:center",onchange:ev=>{sd[sh.sk+"Start"]=ev.target.value}})
      ]),
      e("div",{style:"flex:1;display:flex;flex-direction:column;gap:2px"},[
        e("div",{style:"font-size:10px;color:#64748B;text-align:center"},"עד"),
        e("input",{type:"time",value:sd[sh.sk+"End"]||SHIFT_BY_ID[sh.id]?.end||"15:00",class:"fi",style:"padding:8px 10px;font-size:14px;text-align:center",onchange:ev=>{sd[sh.sk+"End"]=ev.target.value}})
      ])
    ]));
  });
  shiftCard.appendChild(btn("btn-add","שמור שעות",async()=>{
    // Update in-memory SHIFTS arrays (correct indices: 0=morning, 1=morning2, 2=afternoon, 3=night)
    if(sd.morningStart && sd.morningEnd) { SHIFTS[0].start=sd.morningStart; SHIFTS[0].end=sd.morningEnd; }
    if(sd.morning2Start && sd.morning2End) { SHIFTS[1].start=sd.morning2Start; SHIFTS[1].end=sd.morning2End; }
    if(sd.afternoonStart && sd.afternoonEnd) { SHIFTS[2].start=sd.afternoonStart; SHIFTS[2].end=sd.afternoonEnd; }
    if(sd.nightStart && sd.nightEnd) { SHIFTS[3].start=sd.nightStart; SHIFTS[3].end=sd.nightEnd; }
    if(sd.weMorningStart && sd.weMorningEnd) { WEEKEND_SHIFTS[0].start=sd.weMorningStart; WEEKEND_SHIFTS[0].end=sd.weMorningEnd; }
    if(sd.weNightStart && sd.weNightEnd) { WEEKEND_SHIFTS[1].start=sd.weNightStart; WEEKEND_SHIFTS[1].end=sd.weNightEnd; }
    
    // Persist to DB so it survives refresh + other managers see it
    const shiftHours = {
      morning:  { start: SHIFTS[0].start, end: SHIFTS[0].end },
      morning2: { start: SHIFTS[1].start, end: SHIFTS[1].end },
      afternoon:{ start: SHIFTS[2].start, end: SHIFTS[2].end },
      night:    { start: SHIFTS[3].start, end: SHIFTS[3].end },
      weMorning:{ start: WEEKEND_SHIFTS[0].start, end: WEEKEND_SHIFTS[0].end },
      weNight:  { start: WEEKEND_SHIFTS[1].start, end: WEEKEND_SHIFTS[1].end }
    };
    const { error } = await sb.from("businesses").update({shift_hours: shiftHours}).eq("id", S.profile.business_id);
    if (error) { toast("שמירה נכשלה — " + friendlyError(error),"err"); return; }
    S.business.shift_hours = shiftHours;
    if (typeof logAction === "function") logAction("shift_hours_updated", shiftHours);
    toast("שעות עודכנו ✓");
    render();
  }));
  wrap.appendChild(shiftCard);

  // Weekend shift hours
  const weCard = div("card",[e("div",{class:"card-title"},"🕐 שעות שישי — שבת")]);
  weCard.appendChild(e("div",{style:"font-size:12px;color:#64748B;margin-bottom:12px"},"בסופ״ש יש רק 2 משמרות: בוקר ולילה"));
  if(!sd.weMorningStart) sd.weMorningStart = WEEKEND_SHIFTS[0].start;
  if(!sd.weMorningEnd) sd.weMorningEnd = WEEKEND_SHIFTS[0].end;
  if(!sd.weNightStart) sd.weNightStart = WEEKEND_SHIFTS[1].start;
  if(!sd.weNightEnd) sd.weNightEnd = WEEKEND_SHIFTS[1].end;

  weCard.appendChild(e("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#0F172A;border-radius:10px;padding:8px 12px;border:1px solid #F59E0B33"},[
    e("div",{style:"font-weight:700;font-size:12px;color:#F59E0B;min-width:55px"},"בוקר"),
    e("div",{style:"flex:1;display:flex;flex-direction:column;gap:2px"},[
      e("div",{style:"font-size:10px;color:#64748B;text-align:center"},"מ־"),

            if(!(await uiConfirm({title:"למחוק תג?", message:"התג \"" + sys + "\" יוסר לצמיתות.", tone:"danger", okLabel:"מחק תג"}))) return;
            S.systems.splice(i,1);
            await sb.from("businesses").update({systems:S.systems}).eq("id",S.profile.business_id);
            S.business.systems = S.systems;
            toast("המערכת נמחקה");
            render();
          }
        },"×")
      ]));
    });
  }
  sysCard.appendChild(sysListDiv);
  
  // Add new system input
  const sysInputRow = e("div",{style:"display:flex;gap:6px"});
  const sysInput = e("input",{
    class:"fi",
    placeholder:"שם מערכת (לדוגמה: Cortex XDR, Firewall...)",
    style:"flex:1",
    id:"sysAddInput"
  });
  sysInputRow.appendChild(sysInput);
  sysInputRow.appendChild(e("button",{
    style:"padding:10px 16px;background:#3B82F6;color:white;border:none;border-radius:8px;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer",
    onclick:async()=>{
      const inp = document.getElementById("sysAddInput");
      const val = (inp?.value||"").trim();
      if (!val) return;
      if ((S.systems||[]).includes(val)) { toast("המערכת כבר קיימת","err"); return; }
      S.systems = [...(S.systems||[]), val];
      await sb.from("businesses").update({systems:S.systems}).eq("id",S.profile.business_id);
      S.business.systems = S.systems;
      toast("✓ נוספה");
      render();
    }
  },"+ הוסף"));
  sysCard.appendChild(sysInputRow);
  wrap.appendChild(sysCard);

  // Export
  const expCard = div("card",[e("div",{class:"card-title"},"📤 ייצוא סידור")]);
  expCard.appendChild(e("div",{style:"color:#64748B;font-size:13px;margin-bottom:14px"},"ייצא את הסידור השבועי הנוכחי"));
  expCard.appendChild(div("form-actions",[
    btn("btn-green","🖨️ ייצוא PDF / הדפסה",()=>{S.showExportModal="pdf";render();},{style:"flex:1"}),
    btn("btn-sm btn-sm-blue","📊 ייצוא CSV",()=>{S.showExportModal="csv";render();},{style:"flex:1"})
  ]));
  expCard.appendChild(e("button",{
    style:"width:100%;padding:12px;background:#25D366;color:white;border:none;border-radius:10px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;margin-top:10px",
    onclick:()=>{S.showExportModal="whatsapp";render();}
  },"📲 שלח סידור כתמונה ב-WhatsApp"));
  wrap.appendChild(expCard);

  // PWA install
  const pwaCard = div("card",[e("div",{class:"card-title"},"📱 התקנה על הטלפון")]);
  pwaCard.appendChild(e("div",{style:"font-size:13px;color:#94A3B8;margin-bottom:12px"},"התקן את משמרת כאפליקציה על מסך הבית שלך"));

  if (S.pwaPrompt) {
    pwaCard.appendChild(btn("btn-purple","📱 התקן אפליקציה",async()=>{
      S.pwaPrompt.prompt();
      const {outcome}=await S.pwaPrompt.userChoice;
      if(outcome==="accepted"){S.pwaPrompt=null;toast("אפליקציה הותקנה ✓");}
      render();
    },{style:"width:100%"}));
  } else {
    pwaCard.appendChild(e("div",{style:"background:#1E3A5F;border-radius:10px;padding:14px"},[
      e("div",{style:"font-weight:700;font-size:13px;color:#60A5FA;margin-bottom:8px"},"כיצד להתקין:"),
      e("div",{style:"font-size:12px;color:#94A3B8;line-height:1.8"},[
        e("div",{},"📱 iPhone: לחץ על שתף ← הוסף למסך הבית"),
        e("div",{},"🤖 Android: לחץ על תפריט ← הוסף למסך הבית"),
        e("div",{},"💻 Chrome: לחץ על + בשורת הכתובת")
      ])
    ]));
  }
  wrap.appendChild(pwaCard);

  // Change password
  const passCard = div("card",[e("div",{class:"card-title"},"🔐 שינוי סיסמה")]);
  const newPassInp = e("input",{class:"fi",type:"password",placeholder:"סיסמה חדשה (לפחות 10 תווים)",style:"margin-bottom:12px"});
  const confPassInp = e("input",{class:"fi",type:"password",placeholder:"אשר סיסמה חדשה",style:"margin-bottom:12px"});
  passCard.appendChild(div("form-col",[e("label",{class:"form-label"},"סיסמה חדשה"),newPassInp],{style:"margin-bottom:10px"}));
  passCard.appendChild(div("form-col",[e("label",{class:"form-label"},"אישור סיסמה"),confPassInp],{style:"margin-bottom:12px"}));
  passCard.appendChild(e("div",{style:"font-size:11px;color:#64748B;margin-bottom:10px;line-height:1.6"},
    "💡 לפחות 10 תווים"));
  passCard.appendChild(btn("btn-add","🔐 שמור סיסמה חדשה",async()=>{
    const newPass = newPassInp.value;
    const confPass = confPassInp.value;
    const pwErr = validatePassword(newPass);
    if (pwErr) { toast(pwErr, "err"); return; }
    if (newPass !== confPass) { toast("הסיסמאות לא תואמות","err"); return; }
    const {error} = await sb.auth.updateUser({password: newPass});
    if (error) { toast(friendlyError(error),"err"); return; }
    newPassInp.value=""; confPassInp.value="";
    toast("סיסמה עודכנה בהצלחה ✓");
  },{style:"width:100%"}));
  wrap.appendChild(passCard);

  // Transfer ownership — only the actual owner, not just any admin
  if (S.business?.owner_id === S.user?.id) {
    const transCard = div("card",[e("div",{class:"card-title"},"👑 העברת בעלות")]);
    transCard.appendChild(e("div",{style:"font-size:12px;color:#64748B;margin-bottom:12px"},"העבר את תפקיד המנהל הראשי לעובד אחר. לאחר ההעברה תהפוך לעובד רגיל."));

    const empSelect = e("select",{class:"fi",style:"margin-bottom:12px",id:"transfer-select"});
    empSelect.appendChild(e("option",{value:""},"בחר עובד..."));
    S.employees.filter(emp => emp.id !== S.user.id).forEach(emp => {
      empSelect.appendChild(e("option",{value:emp.id},emp.name + " (" + (emp.email||"ללא מייל") + ")"));
    });
    transCard.appendChild(empSelect);

    transCard.appendChild(btn("btn-sm btn-sm-red","👑 העבר בעלות",async()=>{
      const targetId = document.getElementById("transfer-select")?.value;
      if (!targetId) { toast("בחר עובד","err"); return; }
      const targetEmp = getEmp(targetId);
      if (!(await uiConfirm({title:"להעביר בעלות?", message:"לאחר ההעברה:\n• " + targetEmp?.name + " יהפוך למנהל ראשי\n• אתה תהפוך לעובד רגיל\n• הפעולה לא ניתנת לביטול", tone:"danger", okLabel:"המשך להעברה"}))) return;
      if (!(await uiConfirm({title:"אישור סופי", message:"להעביר את כל ההרשאות ל-" + targetEmp?.name + "? הפעולה בלתי הפיכה.", tone:"danger", okLabel:"העבר בעלות"}))) return;

      // Update owner in businesses table
      await sb.from("businesses").update({owner_id: targetId}).eq("id", S.profile.business_id);
      // Make target admin
      await sb.from("profiles").update({role: "admin"}).eq("id", targetId);
      // Demote self to employee
      await sb.from("profiles").update({role: "employee"}).eq("id", S.user.id);

      // Send email to new owner
      if (targetEmp?.email) {
        sendEmail("swap_request", targetEmp.email, {
          requesterName: "מערכת משמרת",
          targetDate: new Date().toLocaleDateString("he-IL"),
          shiftLabel: "👑 הועברה אליך בעלות על המערכת",
          note: S.profile.name + " העביר אליך את ניהול המערכת. כעת יש לך גישת מנהל מלאה."
        });
      }

      toast("הבעלות הועברה ל-" + targetEmp?.name + " ✓");
      await loadAll(S.user);
    },{style:"width:100%"}));
    wrap.appendChild(transCard);
  }

  // Push notifications (personal — this device)
  const pushCard2 = div("card",[e("div",{class:"card-title"},"🔔 התראות Push (למכשיר הזה)")]);
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    pushCard2.appendChild(e("div",{style:"font-size:13px;color:#64748B"},"הדפדפן הזה לא תומך בהתראות Push."));
  } else if (Notification.permission === "denied") {
    pushCard2.appendChild(e("div",{style:"font-size:13px;color:#EF4444"},"ההתראות נחסמו בהגדרות הדפדפן/הטלפון. יש לאפשר אותן מחדש בהגדרות כדי לקבל עדכונים."));
  } else {
    pushCard2.appendChild(e("div",{style:"font-size:13px;color:#94A3B8;margin-bottom:12px"},"קבל התראה אישית על אירועים שנוגעים אליך (למשל אישור חופשה שביקשת, החלטה על חילוף)."));
    pushCard2.appendChild(btn("btn-purple","🔔 הפעל התראות Push",enablePushNotifications,{style:"width:100%;margin-bottom:8px"}));
    pushCard2.appendChild(btn("btn-sm btn-sm-gray","כבה התראות במכשיר הזה",disablePushNotifications,{style:"width:100%"}));
  }
  if (isFeatureEnabled("push_notifications")) wrap.appendChild(pushCard2);

  // Who receives notifications — owner only
  if (S.business?.owner_id === S.user?.id) {
    const allMgrsForCard = S.employees.filter(e => (e.role === "admin" || e.role === "manager") && e.email);
    const configuredIds = S.business?.notified_manager_ids;
    const usingAll = !Array.isArray(configuredIds) || configuredIds.length === 0;
    const selectedSet = new Set(usingAll ? allMgrsForCard.map(m=>m.id) : configuredIds);

    const notifCard = div("card",[e("div",{class:"card-title"},"👑 מי מקבל התראות")]);
    notifCard.appendChild(e("div",{style:"font-size:13px;color:#94A3B8;margin-bottom:12px"},
      "בחר אילו מנהלים יקבלו התראות (מייל + Push) על בקשות חופשה, חילופים והצטרפות למשמרת. כברירת מחדל כולם מקבלים."));

    const listWrap = e("div",{style:"display:flex;flex-direction:column;gap:8px;margin-bottom:12px"});
    allMgrsForCard.forEach(mgr => {
      const isSel = selectedSet.has(mgr.id);
      const row = e("label",{style:"display:flex;align-items:center;gap:10px;background:#0F172A;border:1px solid #334155;border-radius:10px;padding:10px 14px;cursor:pointer"},[
        e("input",{type:"checkbox",checked:isSel?"checked":null,
          onchange:(ev)=>{ if(ev.target.checked) selectedSet.add(mgr.id); else selectedSet.delete(mgr.id); }
        }),
        e("span",{style:"font-size:13px;color:#E2E8F0;font-weight:600"},mgr.name),
        mgr.id === S.business?.owner_id ? e("span",{style:"font-size:10px;color:#FCD34D"},"👑 בעלים") : null
      ]);
      listWrap.appendChild(row);
    });
    notifCard.appendChild(listWrap);

    notifCard.appendChild(btn("btn-purple","💾 שמור",async()=>{
      const ids = Array.from(selectedSet);
      if (ids.length === 0) { toast("בחר לפחות מנהל אחד", "err"); return; }
      const { error } = await sb.from("businesses").update({ notified_manager_ids: ids }).eq("id", S.profile.business_id);
      if (error) { toast(friendlyError(error), "err"); return; }
      S.business.notified_manager_ids = ids;
      toast("הגדרות התראות נשמרו ✓");
      render();
    },{style:"width:100%"}));

    if (!usingAll) {
      notifCard.appendChild(btn("btn-sm btn-sm-gray","איפוס לברירת מחדל (כולם)",async()=>{
        const { error } = await sb.from("businesses").update({ notified_manager_ids: null }).eq("id", S.profile.business_id);
        if (error) { toast(friendlyError(error), "err"); return; }
        S.business.notified_manager_ids = null;
        toast("אופס לברירת מחדל ✓");
        render();
      },{style:"width:100%;margin-top:8px"}));
    }

    wrap.appendChild(notifCard);
  }

  // Danger zone
  const dangerCard = div("card",[e("div",{style:"font-weight:700;font-size:14px;color:#EF4444;margin-bottom:12px"},"⚠️ אזור מסוכן")]);
  dangerCard.appendChild(btn("btn-sm btn-sm-red","יציאה מהמערכת",handleLogout,{style:"margin-bottom:8px;width:100%"}));
  wrap.appendChild(dangerCard);

  return wrap;
}

// ══════════════════════════════════════════════════════
// EMPLOYEE VACATION VIEW (self-service)
// ══════════════════════════════════════════════════════
function viewEmpVacations() {
  // When manager is viewing as employee, use that employee's ID
  const viewingEmpId = S.testAsEmployee && S.empViewId ? S.empViewId : S.user.id;
  const my = S.vacations.filter(x => x.employee_id === viewingEmpId);
  const wrap = div("");

  wrap.appendChild(div("page-title", ["🌴 היעדרויות"]));

  wrap.appendChild(btn("btn-add", "+ הגשת בקשה חדשה", () => {
    S.showAddVac = !S.showAddVac;
    if (S.showAddVac) S.newVac = { type: "vacation", startDate: "", endDate: "", reason: "" };
    render();
  }, { style: "width:100%; margin-bottom:15px; padding:15px; font-weight:800;" }));

  // Submission form
  if (S.showAddVac) {
    const typeIcons = { vacation: "🌴", reserve: "🎖️", exam: "📝" };
    const typeNames = { vacation: "חופשה", reserve: "מילואים", exam: "מבחן" };

    const f = div("card", [div("card-title", ["📝 הגשת בקשה חדשה"])]);

    // Type selector - big buttons
    const typeSel = e("div", { style: "display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px" });
    ["vacation", "reserve", "exam"].forEach(type => {
      const sel = (S.newVac.type || "vacation") === type;
      const colors = { vacation: "#10B981", reserve: "#6366F1", exam: "#F59E0B" };
      typeSel.appendChild(e("button", {
        style: `padding:12px 8px;border-radius:12px;border:2px solid ${sel ? colors[type] : colors[type]+"44"};background:${sel ? colors[type]+"22" : "#0F172A"};color:${sel ? colors[type] : "#64748B"};font-family:inherit;font-weight:800;font-size:13px;cursor:pointer`,
        onclick: () => { S.newVac.type = type; render(); }
      }, [
        e("div", { style: "font-size:20px;margin-bottom:4px" }, typeIcons[type]),
        e("div", {}, typeNames[type])
      ]));
    });
    f.appendChild(typeSel);

    // Info banner based on type
    const infos = {
      vacation: { color: "#10B981", text: "📤 בקשת חופשה תישלח לאישור מנהל — לאחר אישור תחסום את המשמרות" },
      reserve:  { color: "#6366F1", text: "📤 בקשת מילואים תישלח לאישור מנהל — לאחר אישור תחסום את המשמרות" },
      exam:     { color: "#F59E0B", text: "📤 בקשת מבחן תישלח לאישור מנהל — לאחר אישור לא תחסום משמרות, רק תתריע" },
    };
    const info = infos[S.newVac.type || "vacation"];
    f.appendChild(e("div", {
      style: `background:${info.color}11;border:1px solid ${info.color}33;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;color:${info.color};margin-bottom:14px`
    }, info.text));

    f.appendChild(div("form-row", [
      div("form-col", [
        e("label", { class: "form-label" }, "מתאריך *"),
        e("input", { type: "date", class: "fi", value: S.newVac.startDate||"", onchange: x => {
          S.newVac.startDate = x.target.value;
          // Auto-fill end date if empty/earlier — most absences are single-day.
          if (!S.newVac.endDate || S.newVac.endDate < x.target.value) S.newVac.endDate = x.target.value;
          render();
        }})
      ]),
      div("form-col", [
        e("label", { class: "form-label" }, "עד תאריך *"),
        e("input", { type: "date", class: "fi", value: S.newVac.endDate||"", onchange: x => { S.newVac.endDate = x.target.value; render(); } })
      ])
    ]));

    // Live day-count + overlong-range warning (prevents the "wrong year on the wheel" bug).
    if (S.newVac.startDate && S.newVac.endDate && S.newVac.endDate >= S.newVac.startDate) {
      const dayDiff = Math.round((new Date(S.newVac.endDate+"T00:00:00") - new Date(S.newVac.startDate+"T00:00:00")) / 86400000) + 1;
      const tooLong = dayDiff > 90;
      const weirdYear = S.newVac.endDate.slice(0,4) !== S.newVac.startDate.slice(0,4) && dayDiff > 180;
      f.appendChild(e("div",{style:`padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px;font-weight:600;background:${tooLong ? "#EF444422" : "#10B98122"};color:${tooLong ? "#FCA5A5" : "#86EFAC"};border:1px solid ${tooLong ? "#EF444466" : "#10B98144"}`},
        tooLong
          ? `⚠️ טווח חריג: ${dayDiff} ימים${weirdYear ? " (חוצה שנה — בדוק שהשנה נכונה!)" : ""}`
          : `✓ ${dayDiff} ${dayDiff === 1 ? "יום" : "ימים"}`
      ));
    }

    // Partial-day option for the first & last days (vacation/reserve only — exam doesn't block)
    if ((S.newVac.type || "vacation") !== "exam" && S.newVac.startDate && S.newVac.endDate && S.newVac.endDate >= S.newVac.startDate) {
      if (!S.newVac.startDayShifts) S.newVac.startDayShifts = null; // null = whole day
      if (!S.newVac.endDayShifts) S.newVac.endDayShifts = null;

      const buildPartialRow = (label, dateStr, key) => {
        const wrapEl = e("div", { style: "background:#0F172A;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:10px" });
        const partial = S.newVac[key] != null; // array present = partial
        wrapEl.appendChild(e("div", { style: "display:flex;justify-content:space-between;align-items:center;margin-bottom:8px" }, [
          e("div", { style: "font-size:12px;font-weight:700;color:#E2E8F0" }, label + " (" + fmtDate(dateStr) + ")"),
          e("label", { style: "display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:#94A3B8" }, [
            e("input", { type: "checkbox", checked: partial ? "checked" : null, onchange: (ev) => {
              S.newVac[key] = ev.target.checked ? [] : null;
              render();
            }}),
            e("span", {}, "יום חלקי (יכול לעבוד חלק מהמשמרות)")
          ])
        ]));
        if (partial) {
          wrapEl.appendChild(e("div", { style: "font-size:10px;color:#64748B;margin-bottom:8px" }, "סמן את המשמרות שאתה לא יכול לעבוד ביום הזה:"));
          const chips = e("div", { style: "display:flex;flex-wrap:wrap;gap:6px" });
          SHIFTS.forEach(sh => {
            const blocked = (S.newVac[key] || []).includes(sh.id);
            chips.appendChild(e("button", {
              style: `padding:6px 12px;border-radius:8px;border:1px solid ${blocked ? sh.color : "#334155"};background:${blocked ? sh.color+"22" : "#1E293B"};color:${blocked ? sh.color : "#64748B"};font-family:inherit;font-size:12px;font-weight:700;cursor:pointer`,
              onclick: () => {
                const arr = S.newVac[key] || [];
                S.newVac[key] = blocked ? arr.filter(x => x !== sh.id) : [...arr, sh.id];
                render();
              }
            }, (blocked ? "🚫 " : "") + sh.label));
          });
          wrapEl.appendChild(chips);
        }
        return wrapEl;
      };

      const partWrap = e("div", { style: "margin-bottom:14px" });
      partWrap.appendChild(e("div", { style: "font-size:12px;font-weight:700;color:#A855F7;margin-bottom:8px" }, "🕐 ימים חלקיים (אופציונלי)"));
      partWrap.appendChild(buildPartialRow("יום ראשון של החופש", S.newVac.startDate, "startDayShifts"));
      // Only show the last-day row if it's a different day
      if (S.newVac.endDate !== S.newVac.startDate) {
        partWrap.appendChild(buildPartialRow("יום אחרון של החופש", S.newVac.endDate, "endDayShifts"));
      }
      f.appendChild(partWrap);
    }

    f.appendChild(e("label", { class: "form-label", style: "margin-top:8px;display:block" }, "הערה (אופציונלי)"));
    f.appendChild(e("input", {
      class: "fi", placeholder: "למשל: מבחן בליניארית, מילואים בנגב...",
      style: "margin-bottom:14px",
      oninput: x => S.newVac.reason = x.target.value
    }));

    f.appendChild(btn("btn-primary", "שלח בקשה", async () => {
      if (!S.newVac.startDate || !S.newVac.endDate) return toast("נא למלא תאריכים", "err");
      await addVacation();
      S.showAddVac = false;
      render();
    }, { style: "width:100%; padding:12px;" }));
    wrap.appendChild(f);
  }

  // List of requests
  if (my.length === 0) {
    wrap.appendChild(div("card", [e("div", { style: "text-align:center;padding:24px;color:#64748B" }, "אין בקשות קודמות")]));
  } else {
    const card = div("card");
    const typeIcons2 = { vacation: "🌴", reserve: "🎖️", exam: "📝" };
    const typeNames2 = { vacation: "חופשה", reserve: "מילואים", exam: "מבחן" };
    const typeColors = { vacation: "#10B981", reserve: "#6366F1", exam: "#F59E0B" };
