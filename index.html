// Returns which admins/managers should receive absence/swap/join notifications.
// The business owner can narrow this down in Settings; otherwise it's everyone with the role.
function getNotifiedManagers() {
  const allMgrs = S.employees.filter(e => (e.role === "admin" || e.role === "manager") && e.email);
  const configured = S.business?.notified_manager_ids;
  if (Array.isArray(configured) && configured.length > 0) {
    return allMgrs.filter(m => configured.includes(m.id));
  }
  return allMgrs;

// Time-based greeting in Hebrew — use Israel wall-clock so someone opening the
// app from abroad still gets the greeting that matches their team's day.
function getTimeBasedGreeting() {
  const hour = israelNow().getHours();
  if (hour >= 5 && hour < 12) return { text: "בוקר טוב", emoji: "☀️" };       // 05:00 - 11:59
  if (hour >= 12 && hour < 17) return { text: "צהריים טובים", emoji: "🌤️" };  // 12:00 - 16:59
  if (hour >= 17 && hour < 21) return { text: "ערב טוב", emoji: "🌆" };       // 17:00 - 20:59
  return { text: "לילה טוב", emoji: "🌙" };                                    // 21:00 - 04:59
}

// Generate cryptographically secure token (64 hex chars = 256 bits entropy)
function generateSecureToken() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return Array.from(arr, b => b.toString(16).padStart(2, "0")).join("");
}

// Validate email format
function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// Reads ?goto=<target> from the URL and navigates to the matching screen.
// Works for both managers and employees (routing differs by role).
function applyDeepLink() {
  let goto = null;
  try {
    const params = new URLSearchParams(window.location.search);
    goto = params.get("goto");
  } catch (e) { return; }
  if (!goto) return;

  const isMgr = (typeof isManager === "function") ? isManager() : (S.profile?.role !== "employee");

  // Map the goto target to the right view/tab for this role
  switch (goto) {
    case "schedule":
      if (isMgr) { S.view = "schedule"; }
      else { S.view = "empview"; S.empViewTab = "schedule"; }
      break;
    case "vacations":
      if (isMgr) { S.view = "vacations"; }
      else { S.view = "empview"; S.empViewTab = "vacation"; }
      break;
    case "swaps":
      if (isMgr) { S.view = "swaps"; }
      else { S.view = "empview"; S.empViewTab = "swaps_emp"; }
      break;
    case "blocks":
      if (isMgr) { S.view = "blocks"; }
      else { S.view = "empview"; S.empViewTab = "avail"; }
      break;
    case "join":
    case "home":
      S.view = isMgr ? "home" : "empview";
      break;
    case "shifts":
      S.view = "empview"; S.empViewTab = "shifts";
      break;
    default:
      break;
  }

  // Clean the URL so a refresh doesn't re-trigger the deep link
  try {
    const clean = window.location.origin + window.location.pathname;
    window.history.replaceState({}, "", clean);
  } catch (e) {}
}

async function checkAuth() {
  // Check for invitation token in URL
  const params = new URLSearchParams(window.location.search);
  const inviteToken = params.get("invite");
  const bizInviteToken = params.get("biz_invite");

  if (bizInviteToken) {
    const { data, error } = await sb.rpc("validate_business_invite_token", { p_token: bizInviteToken });
    if (error || !data || data.length === 0) {
      await uiAlert({title:"לינק לא תקין", message:"הלינק שהשתמשת בו לא נמצא במערכת.", tone:"danger"});
      window.history.replaceState({}, "", window.location.pathname);
    } else {
      const inv = data[0];
      if (!inv.is_valid) {
        const reasons = {
          invalid_token: "הלינק לא תקין",
          already_used: "ההזמנה כבר נוצלה",
          revoked: "ההזמנה בוטלה",
          expired: "ההזמנה פגה"
        };
        await uiAlert({title:"הזמנה לא תקפה", message:reasons[inv.error_reason] || "ההזמנה לא זמינה יותר.", tone:"danger"});
        window.history.replaceState({}, "", window.location.pathname);
      } else {
        S.pendingBizInvite = { token: bizInviteToken, email: inv.email, note: inv.note };
        S.loginMode = "register";
        S.view = "login";
        render();
        return;
      }
    }
  }

  if (inviteToken) {
    // Validate the token
    const { data, error } = await sb.rpc("validate_invitation_token", { p_token: inviteToken });
    if (error || !data || data.length === 0) {
      await uiAlert({title:"לינק לא תקין", message:"הלינק שהשתמשת בו לא נמצא במערכת.", tone:"danger"});
      window.history.replaceState({}, "", window.location.pathname);
    } else {
      const inv = data[0];
      if (!inv.is_valid) {
        const reasons = {
          invalid_token: "הלינק לא תקין",
          already_used: "ההזמנה כבר נוצלה",
          revoked: "ההזמנה בוטלה",
          expired: "ההזמנה פגה"
        };
        await uiAlert({title:"הזמנה לא תקפה", message:reasons[inv.error_reason] || "ההזמנה לא זמינה יותר.", tone:"danger"});
        window.history.replaceState({}, "", window.location.pathname);
      } else {
        // Valid - show special invitation signup
        S.pendingInvitation = {
          token: inviteToken,
          email: inv.email,
          name: inv.name,
          role: inv.role,
          businessName: inv.business_name
        };
        S.loginMode = "accept_invitation";
        S.view = "login";
        render();
        return;
      }
    }
  }
  
  // Password-reset flow — when the user clicks the link from the "forgot password"
  // email, Supabase creates a recovery session and redirects here with ?reset=true.
  // Previously we just dumped them into loadAll → MFA challenge → login WITHOUT letting
  // them pick a new password. Now we route to a dedicated password-reset view instead.
  const isResetFlow = params.get("reset") === "true" || /[?&#]type=recovery/.test(window.location.href);
  if (isResetFlow) {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      S.view = "password_reset";
      S.resetUserEmail = session.user.email || "";
      // Keep the URL clean so a refresh doesn't re-trigger the flow after they save.
      window.history.replaceState({}, "", window.location.pathname);
      render();
      return;
    }
  }

  const { data: { session } } = await sb.auth.getSession();
  if (!session?.user) { S.view="login"; render(); return; }
  await loadAll(session.user);
}

// User must choose a new password before we take them into the app (and before the

  card.appendChild(p1);
  card.appendChild(p2);
  card.appendChild(e("div",{style:"font-size:11px;color:#64748B;margin-bottom:12px;line-height:1.5"},
    "💡 לפחות 10 תווים"));
  card.appendChild(btn("btn-primary","✓ שמור סיסמה חדשה", async () => {
    const newPass = p1.value;
    const confPass = p2.value;
    const pwErr = validatePassword(newPass);
    if (pwErr) { toast(pwErr, "err"); return; }
    if (newPass !== confPass) { toast("הסיסמאות לא תואמות", "err"); return; }
    try {
      const { error } = await sb.auth.updateUser({ password: newPass });
      if (error) { toast(friendlyError(error), "err"); return; }
      toast("סיסמה עודכנה ✓");
      // Now hand off to the normal MFA gate — the user will be asked for their
      // Authenticator code (if they have one) or to enroll (if not).
      const { data: { user } } = await sb.auth.getUser();
      if (user) await loadAll(user);
      else { S.view = "login"; render(); }
    } catch (err) {
      toast(friendlyError(err), "err");
    }
  },{style:"width:100%"}));

  box.appendChild(card);

  box.appendChild(e("div",{style:"text-align:center;margin-top:20px"},[
    e("a",{href:"#", style:"color:#64748B;font-size:13px;text-decoration:underline", onclick: async (ev) => {
      ev.preventDefault();
      await sb.auth.signOut();
      location.reload();
    }}, "ביטול והתנתקות")
  ]));

  wrap.appendChild(box);
  return wrap;
}

let _touchStartX = null, _touchStartY = null;
function setupSwipeGestures() {
  document.removeEventListener("touchstart", _onTouchStart);
  document.removeEventListener("touchend", _onTouchEnd);
  document.addEventListener("touchstart", _onTouchStart, {passive:true});
  document.addEventListener("touchend", _onTouchEnd, {passive:true});
}
function _onTouchStart(e) {
  if (e.touches.length !== 1) return;
  _touchStartX = e.touches[0].clientX;
  _touchStartY = e.touches[0].clientY;
}
function _onTouchEnd(e) {
  if (_touchStartX == null) return;
  const dx = e.changedTouches[0].clientX - _touchStartX;
  const dy = e.changedTouches[0].clientY - _touchStartY;
  _touchStartX = null;
  // Must be a horizontal swipe (more X than Y, more than 80px)
  if (Math.abs(dx) < 80 || Math.abs(dy) > 50) return;
  // Don't trigger on inputs or buttons
  const t = e.target;
  if (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "BUTTON" || t.tagName === "SELECT") return;
  if (t.closest(".modal,.bottom-sheet,.emp-chip,.shift-cell")) return;
  
  // Only swipe in schedule views
  if (S.view === "schedule") {
    // If in mobile day mode, swipe between days
    if (S.schedMobileView === "day") {
      if (dx > 0) {
        // Next day
        if (S.schedDayIdx < 6) { S.schedDayIdx++; render(); }
        else { S.weekOffset++; S.schedDayIdx = 0; loadSchedule().then(()=>render()); }
      } else {
        // Prev day
        if (S.schedDayIdx > 0) { S.schedDayIdx--; render(); }
        else { S.weekOffset--; S.schedDayIdx = 6; loadSchedule().then(()=>render()); }
      }
    } else {
      // RTL: swipe right (positive dx) = next week, swipe left = prev week
      if (dx > 0) { S.weekOffset++; loadSchedule().then(()=>render()); }
      else { S.weekOffset--; loadSchedule().then(()=>render()); }
    }
  } else if (S.view === "calendar") {
    if (dx > 0) { S.monthOffset++; render(); }
    else { S.monthOffset--; render(); }
  } else if (S.view === "empview" && S.empViewTab === "schedule") {
    if (dx > 0) { S.weekOffset++; loadSchedule().then(()=>render()); }
    else { S.weekOffset--; loadSchedule().then(()=>render()); }
  }
}

      const isActive = S.view===t.id;
      const btn2 = e("button",{
        style:`flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px 8px;border:none;border-top:2px solid ${isActive?"#3B82F6":"transparent"};background:transparent;color:${isActive?"#3B82F6":"#64748B"};font-family:inherit;cursor:pointer;position:relative;min-height:56px;transition:color 0.15s`,
        onclick:()=>{
          if(t.id==="swaps_nav"){S.view="empview";S.empViewTab="swaps_emp";S.selectedCell=null;render();}
          else if(t.id==="mymonth_nav"){S.view="empview";S.empViewTab="mymonth";S.selectedCell=null;render();}
          else if(t.id==="empview"){S.view="empview";S.empViewTab="shifts";S.selectedCell=null;render();}
          else{S.view=t.id;S.selectedCell=null;render();}
        }
      },[
        t.badge>0?e("span",{style:"position:absolute;top:6px;right:calc(50% - 16px);background:#EF4444;color:white;border-radius:50%;width:14px;height:14px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center"},String(t.badge)):null,
        e("span",{style:"font-size:22px;line-height:1"},t.icon),
        e("span",{style:`font-size:10px;font-weight:${isActive?"700":"500"};margin-top:1px`},t.label)
      ]);
      bottomNav.appendChild(btn2);
    });
    app.appendChild(bottomNav);
  }

  // Toast — aria-live announces to screen readers; assertive for errors (interrupt),
  // polite for success (wait for current speech to finish).
  if(S.toast) {
    const isErr = S.toast.type === "err";
    const icon = isErr ? "⚠️" : "✓";
    const toastEl = e("div",{
      class:"toast"+(isErr?" err":""),
      role:"status",
      "aria-live": isErr ? "assertive" : "polite",
      "aria-atomic":"true"
    },[
      e("span",{class:"toast-icon", "aria-hidden":"true"}, icon),
      e("span",{class:"toast-msg"}, S.toast.msg),
      S.toast.undo ? e("button",{
        class:"toast-close",
        style:"background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.3);padding:4px 12px;border-radius:8px;color:white;font-weight:700;font-size:12px;margin-left:8px",
        onclick: async () => {
          const fn = S.toast.undo;
          S.toast = null;
          render();
          try { await fn(); toast("בוטל ✓"); } catch(err) { toast("ביטול נכשל", "err"); }
        }
      }, "↶ בטל") : null,
      e("button",{class:"toast-close", "aria-label":"סגור הודעה", onclick:()=>{S.toast=null;render();}}, "✕")
    ]);
    app.appendChild(toastEl);
  }
  // Custom dialog (replaces browser confirm/prompt/alert)
  if (S.dialog) {
    const d = S.dialog;
    const okBtnClass = "dlg-btn dlg-btn-"+(d.tone === "danger" ? "danger" : d.tone === "warn" ? "warn" : "primary");
    const inputEl = d.kind === "prompt"
      ? e("input",{class:"dlg-input",type:"text",value:d.defaultValue||"",placeholder:d.placeholder||"",id:"_dlg_input",
          onkeydown:(ev)=>{if(ev.key==="Enter") _closeDialog(ev.target.value); if(ev.key==="Escape") _closeDialog(null);}})
      : null;
    const backdrop = e("div",{class:"dlg-backdrop", onclick:(ev)=>{
      if (ev.target === ev.currentTarget) _closeDialog(d.kind === "confirm" ? false : null);
    }},[
      e("div",{class:"dlg", onclick:(ev)=>ev.stopPropagation()},[
        e("div",{class:"dlg-icon "+d.tone}, d.icon),
        e("div",{class:"dlg-title"}, d.title),
        d.message ? e("div",{class:"dlg-msg"}, d.message) : null,
        inputEl,
        e("div",{class:"dlg-actions"}, [
          d.kind !== "alert" ? e("button",{class:"dlg-btn dlg-btn-ghost",
            onclick:()=>_closeDialog(d.kind === "confirm" ? false : null)}, d.cancelLabel) : null,
          e("button",{class:okBtnClass, onclick:()=>{
            if (d.kind === "prompt") {
              const inp = document.getElementById("_dlg_input");
              _closeDialog(inp ? inp.value : "");
            } else if (d.kind === "confirm") {
              _closeDialog(true);
            } else {
              _closeDialog();
            }
          }}, d.okLabel),
        ]),
      ]),
    ]);
    app.appendChild(backdrop);
    if (d.kind === "prompt") {
      setTimeout(()=>{const i=document.getElementById("_dlg_input");if(i){i.focus();i.select();}}, 50);
    }
  }

  // Restore scroll position after the DOM is rebuilt so users don't jump to top on every
  // interaction. rAF ensures the new DOM has been laid out before we scroll.
  requestAnimationFrame(() => {
    if (savedScroll > 0) window.scrollTo(0, savedScroll);
    const newSchedWrap = app.querySelector(".sched-wrap");
    if (newSchedWrap) {
      if (savedSchedScrollLeft !== null) {
        // Restore the horizontal scroll from before this render.
        newSchedWrap.scrollLeft = savedSchedScrollLeft;
      } else {
        // First time we're seeing the schedule — scroll today's column into view so the
        // user lands on the current day rather than the start of the week.
        // scrollIntoView handles RTL correctly on iOS/Chrome/Safari without manual math.
        const todayCell = newSchedWrap.querySelector(".day-header.is-today");
        if (todayCell) {
          try {
            todayCell.scrollIntoView({block:"nearest", inline:"center", behavior:"instant"});
          } catch(_){
            // Older browsers don't support "instant"; fall back to default.
            todayCell.scrollIntoView({block:"nearest", inline:"center"});
          }
        }
      }
    }
  });

  // Parse emoji → SVG via Twemoji (if loaded). Guarantees colorful emoji on every
  // platform including Windows without Segoe UI Emoji / Linux / ChromeOS.
  if (typeof twemoji !== "undefined") {
    try {
      twemoji.parse(document.body, {
        folder: "svg",
        ext: ".svg",
        base: "https://cdn.jsdelivr.net/gh/jdecked/twemoji@14.1.2/assets/",
      });
    } catch(e) { /* non-fatal */ }
  }
}

// PWA install prompt
window.addEventListener("beforeinstallprompt", (e) => {
  // Don't prevent default — just save the event for later
  S.pwaPrompt = e;
});

// Service worker registration
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

// AUTO-REMINDER CHECK
async function checkAutoReminder() {
  if (!isManager()) return;
  const biz = S.business;
  if (!biz) return;
  // Business-local (Israel) — the reminder fires when it's time at the business,
  // not when it happens to be that time on the admin's device.
  const now = israelNow();
  const currentTime = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");

  // ─── Auto-reminder for blocks submission ───
  if (biz.reminder_day == null) return;
  if (now.getDay() !== biz.reminder_day) return;
  if (currentTime < (biz.reminder_time||"09:00")) return;
  const sentKey = "reminder_sent_"+now.getDay()+"_"+getWeekDates(1)[0];
  if (localStorage.getItem(sentKey)) return;
  const nextWD = getWeekDates(1);
  const sub = S.availSubmissions.filter(s=>s.week_start===nextWD[0]).map(s=>s.employee_id);
  const notSub = S.employees.filter(emp=>!sub.includes(emp.id)&&emp.email&&emp.role!=="admin"&&emp.role!=="manager");
  if (notSub.length===0) return;
  for (const emp of notSub) {
    const adlDay = S.business?.deadline_day;
    const adlTime = S.business?.deadline_time || "20:00";
    const adlText = adlDay != null ? "יום " + DAYS[adlDay] + " בשעה " + adlTime : "";
    await sendEmail("reminder",emp.email,{weekLabel:fmtDate(nextWD[0])+" — "+fmtDate(nextWD[6]),deadline:adlText});
  }
  localStorage.setItem(sentKey,"1");
}

// SILENT REFRESH — reload data after actions + every 30 seconds
let _autoRefreshTimer = null;
let _refreshDebounce = null;

function isUserBusy() {
  if (S.selectedCell) return true;
  if (S.constraintsEmp) return true;
  if (S.showAddEmp) return true;
  if (S.showAddVac) return true;
  if (S.showMgrAddVac) return true;   // manager's add-vacation form
  if (S.showInviteModal) return true; // invite-new-employee modal (has email/name inputs)
  if (S.showPublishModal) return true;
  if (S.showPreviewSelectModal) return true;
  if (S.showExportModal) return true;
  if (S.showWeekNotes) return true;
  if (S.showSwapModal) return true;
  if (S.dialog) return true;          // custom confirm/prompt/alert dialog is open
  if (S._datePickerOpen) return true; // any date/time picker is currently open
  // Only count as "busy" when the user is MID-EDIT — not just viewing a page.
  // The old behavior treated the whole blocks page as busy, which killed every
  // realtime push while the user was there (own submissions, manager approvals,
  // peer updates). Now viewing is fine; only an unsaved draft or a focused input blocks a refresh.
  if (Object.values(S.availDraft||{}).some(Boolean)) return true;
  // Any input/textarea/select focused
  if (document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA" || document.activeElement.tagName === "SELECT")) return true;
  return false;
}

function silentRefresh() {
  clearTimeout(_refreshDebounce);
  _refreshDebounce = setTimeout(async () => {
    if (!S.user || S.view === "login" || S.view === "loading") return;
    if (isUserBusy()) {
      return;
    }
    try {
      await Promise.all([loadSchedule(), loadAvailSubmissions(), loadSwapRequests(), loadVacations(), loadEmployees(), loadJoinRequests()]);
      S._lastDataRefresh = Date.now();
      S._online = true;
      persistOfflineCache();
      render();
    } catch(err) {
      console.warn("🔄 Refresh failed:", err);
      // Mark offline so the banner appears; realtime 'online' event will flip it back.
      if (navigator.onLine === false) { S._online = false; render(); }
    }
  }, 1500);
}

function startAutoRefresh() {
  if (_autoRefreshTimer) clearInterval(_autoRefreshTimer);
  _autoRefreshTimer = setInterval(() => {
    if (!isUserBusy()) silentRefresh();
  }, 30000);
}

// ═══ Session timeout — force re-login (and 2FA) after 30 min of inactivity ═══
// Reasoning: Supabase sessions last for hours/days by default. For a security-sensitive
// SOC environment, require password + 2FA every 30 minutes of no interaction.
const SESSION_TIMEOUT_MS = 30 * 60 * 1000;
let _lastActivityMs = Date.now();
let _sessionTimeoutTimer = null;
function bumpActivity() { _lastActivityMs = Date.now(); }
// Activity events — include input/change/focus so filling a long form while the iOS
// date-wheel is open (no scroll/keydown) still counts as activity and avoids a
// mid-form session timeout.
["mousedown","keydown","touchstart","touchmove","scroll","input","change","focus","pointerdown"].forEach(ev =>
  window.addEventListener(ev, bumpActivity, { passive: true, capture: true })
);
function startSessionTimeout() {
  if (_sessionTimeoutTimer) clearInterval(_sessionTimeoutTimer);
  _lastActivityMs = Date.now();
  _sessionTimeoutTimer = setInterval(async () => {
    if (!S.user || S.view === "login" || S.view === "loading") return;
    if (S.view === "mfa_enroll" || S.view === "mfa_challenge" || S.view === "password_reset") return; // mid-auth
    if (Date.now() - _lastActivityMs < SESSION_TIMEOUT_MS) return;
    try {
      clearInterval(_sessionTimeoutTimer);
      clearInterval(_autoRefreshTimer);
      await sb.auth.signOut();
      toast("ההתחברות פגה — נא להתחבר מחדש");
      setTimeout(() => location.reload(), 1200);
    } catch (err) {
      console.warn("Session timeout sign-out failed:", err);
      location.reload();
    }
  }, 30000); // check every 30s
}

// INIT
checkAuth();
startSessionTimeout();
</script>
